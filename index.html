function plFrame(){
  if(!PL.playing) return;
  const ctx=AU.ctx, spb=60/(PL.song.bpm*PL.tf), now=ctx.currentTime-outLat();
  if(now<PL.ciEnd){ const k=Math.ceil((PL.ciEnd-now)/(PL.clickUnit*spb)); $('#plstatus').innerHTML=`<span class="countin num">${k}</span><span class="msg">预备……跟着节拍器数拍子</span>`; }
  else{
    const b=PL.b0+(now-PL.T0)/spb;
    if(b>=PL.b0-1e-6){ plShowAt(b,true);
      const mi=PL.P.measures.findIndex((m,i)=>b>=m.t-1e-6&&(i===PL.P.measures.length-1||b<PL.P.measures[i+1].t-1e-6));
      const no=PL.P.pickup?mi:mi+1;
      const msg=`<span class="msg">第 <b class="num">${Math.max(no,0)}</b> 小节 · ♩=${Math.round(PL.song.bpm*PL.tf)}${PL.loop?' · 循环中':''}</span>`;
      if(PL._msg!==msg){PL._msg=msg; $('#plstatus').innerHTML=msg;} }
  }
  PL.raf=requestAnimationFrame(plFrame);
}
function plRetime(){
  // 改速度时，以旧速度算出当前拍位，再从这里按新速度继续
  const now=AU.ctx.currentTime, spb=60/(PL.song.bpm*PL.tf);
  if(now<PL.ciEnd){ plStop(); plPlay(); return; }
  const b=PL.b0+(now-PL.T0)/PL.lastSpb;
  PL.b0=b; PL.T0=now; PL.nextEv=PL.P.evs.findIndex(e=>e.t>=b+.02); if(PL.nextEv<0) PL.nextEv=PL.P.evs.length;
  PL.nextClick=secStart()+Math.ceil((b-secStart())/PL.clickUnit-1e-6)*PL.clickUnit;
  PL.lastSpb=spb;
}
function plPause(){
  if(!PL.playing) return; const spb=60/(PL.song.bpm*PL.tf);
  const b=PL.b0+(AU.ctx.currentTime-PL.T0)/spb;
  plStop();
  let st=secStart(); for(const e of PL.P.evs) if(!e.rest&&handOn(e.hand)&&e.t<=b+1e-6&&e.t>=secStart()) st=e.t;
  PL.startBeat=Math.max(secStart(),st); plIdle();
  $('#plstatus').innerHTML=`<span class="msg">已暂停。按播放从光标处继续，或点 ${'↺'} 从段落开头。</span>`;
}
function plStop(){ PL.playing=false; clearInterval(PL.timer); cancelAnimationFrame(PL.raf); PL.lastSpb=null; PL._msg=''; if($('#plplay')){$('#plplay').innerHTML=ICON.play;} }
function plFinished(){
  PL.startBeat=secStart(); plIdle(); logToday('p'); save();
  const whole=PL.secA===0&&PL.secB===PL.P.measures.length-1;
  const F=PL.fb; let heard='', sug;
  if(F){ F.pend.forEach(p=>{ const ok=p.on&&[...p.req].every(r=>p.got.has(r)); F.total++; if(ok) F.hit++; markEv(p.e,ok); }); F.pend=[];
    if(F.total){ const pct=Math.round(F.hit/F.total*100); heard=`听到你弹对了 ${F.hit} / ${F.total} 个音（${pct}%），谱子上红色的是没听清或弹错的。`; sug=pct>=92&&PL.tf>=.95?3:pct>=80?2:1; } }
  if(whole) rateSong(PL.id,{title:'弹完一遍！',text:heard||`速度 ${Math.round(PL.tf*100)}%，${PL.hands==='B'?'双手':PL.hands==='L'?'左手':'右手'}。这一遍感觉怎么样？`,suggest:sug});
  else toast(heard||'这一段弹完了！可以打开“循环段落”多练几遍');
}
// 当前所练的手在 [a,b) 拍之间的“拍点”：同一时刻要按下的音归为一组
function groupsFor(a,b){
  const groups=[];
  PL.P.evs.forEach(e=>{ if(e.rest||!handOn(e.hand)||e.t<a-1e-6||e.t>=b-1e-6) return;
    let g=groups.find(x=>Math.abs(x.t-e.t)<1e-6); if(!g){g={t:e.t,evs:[],req:new Set()};groups.push(g);} g.evs.push(e); e.notes.forEach(n=>g.req.add(n.midi)); });
  // sound：这一刻按谱应该响着的所有音（含之前按住没放的），识别时用来排除八度误判
  groups.forEach(g=>{ g.sound=new Set(g.req); PL.P.evs.forEach(e=>{ if(!e.rest&&e.t<g.t-1e-6&&g.t<e.t+e.d-1e-6) e.notes.forEach(n=>g.sound.add(n.midi)); }); });
  return groups.sort((x,y)=>x.t-y.t);
}
const clearMarks=()=>$$('#plscore g.ev.ok,#plscore g.ev.no').forEach(g=>g.classList.remove('ok','no'));
function markEv(e,ok){ const g=PL.gs[e.i]; if(g){ g.classList.remove('ok','no'); g.classList.add(ok?'ok':'no'); } }

function plRefreshStatus(){ if(PL.mode==='wait'&&PL.wm) wmShow(); else if(!PL.playing) plIdle(); }
function plMic(fr){
  const h=$('#plheard'); if(h){ const name=fr.top.length?midiName(fr.top[0]).replace('#','♯'):'…'; const lv=Math.min(1,fr.rms*12);
    if(h._n!==name){h._n=name; h.querySelector('b').textContent='听到 '+name;} h.querySelector('i').style.setProperty('--lv',lv.toFixed(2)); }
  if(PL.mode==='wait'&&PL.wm) wmMic(fr); else if(PL.playing&&PL.fb) fbMic(fr);
}
// 等待模式：起音后 0.6 秒内，该弹的音都听到了就前进；明显听到别的音就记一次错
function wmMic(fr){
  const W=PL.wm, g=W.groups[W.gi]; if(!g) return;
  if(fr.onset){ W.mOn=fr.t; W.mWrong=false; W.mGot=new Set(); }
  if(W.mOn==null||fr.t-W.mOn>.7||fr.t-W.mOn<.1) return;
  g.req.forEach(r=>{ if(notePresent(fr,r,g.sound)&&!W.mGot.has(r)){ W.mGot.add(r); const k=PL.kb.keys.get(r); if(k) k.classList.add('good'); } });
  if([...g.req].every(r=>W.mGot.has(r))){ W.mOn=null; W.hits++; wmAdvance(false); return; }
  if(!W.mWrong&&fr.t-W.mOn>.16&&fr.top.length){
    const t0=fr.top[0], related=[...g.sound].some(r=>[0,12,-12,19,24].includes(t0-r));
    if(!related&&fr.sal[t0]>=fr.mx*.95){ W.mWrong=true; W.miss++; kbFlash(PL.kb,t0,'bad',600);
      const s=$('#plstatus .msg b:nth-of-type(3)'); if(s) s.textContent=W.miss;
      toast(`听到的是 ${midiName(t0).replace('#','♯')}，应该弹 ${[...g.req].map(m=>midiName(m).replace('#','♯')).join(' + ')}`); } }
}
// 跟随模式：每个音在它该响的时刻前后检查
function fbMic(fr){
  const F=PL.fb;
  for(const p of F.pend){ if(fr.t<p.T-.22) break; if(fr.t>p.T+.5) continue;
    if(fr.onset&&fr.t<=p.T+.32) p.on=true;
    if(fr.t>=p.T+.15) p.req.forEach(r=>{ if(notePresent(fr,r,p.sound)) p.got.add(r); }); }
  while(F.pend.length&&fr.t>F.pend[0].T+.5){ const p=F.pend.shift(); const ok=p.on&&[...p.req].every(r=>p.got.has(r)); F.total++; if(ok) F.hit++; markEv(p.e,ok); }
}
/* 上传录音评测 */
async function plAnalyzeFile(file){
  plStop(); PL.wm=null;
  modal(`<h3>正在分析录音…</h3><p class="muted" id="anaprog">读取文件</p>`);
  let frames;
  try{ frames=await analyzeRecording(file,p=>{const n=$('#anaprog'); if(n) n.textContent='分析中 '+Math.round(p*100)+'%';}); }
  catch(err){ console.warn(err); modal(`<h3>没能读取这段录音</h3><p class="muted">换成手机录音 App 录的 m4a / mp3 / wav 文件，或者录视频再上传试试。</p><div class="mrow" style="margin-top:14px"><button class="btn pri" data-x>好的</button></div>`,m=>$('[data-x]',m).onclick=closeModal); return; }
  const ons=onsetsFromFrames(frames), groups=groupsFor(secStart(),secEnd());
  if(ons.length<3){ modal(`<h3>几乎没听到琴声</h3><p class="muted">录音里只识别到 ${ons.length} 个音。把手机放近钢琴一点，环境安静一些，再录一次。</p><div class="mrow" style="margin-top:14px"><button class="btn pri" data-x>好的</button></div>`,m=>$('[data-x]',m).onclick=closeModal); return; }
  const res=alignTake(groups,ons); clearMarks();
  let ok=0; const probs=[], pairs=[];
  res.forEach((r,i)=>{ const g=groups[i]; g.evs.forEach(e=>markEv(e,r.st==='ok')); if(r.st==='ok'){ok++; pairs.push([g.t,r.on.t]);} else probs.push({g,r}); });
  const pct=Math.round(ok/groups.length*100);
  let bpm=null; if(pairs.length>=4){ const n=pairs.length, mx=pairs.reduce((a,p)=>a+p[0],0)/n, my=pairs.reduce((a,p)=>a+p[1],0)/n;
    let sxy=0,sxx=0; pairs.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)*(x-mx);}); const spb=sxy/sxx; if(spb>0) bpm=Math.round(60/spb); }
  const mno=t=>{ const mi=PL.P.measures.findIndex((m,i)=>t>=m.t-1e-6&&(i===PL.P.measures.length-1||t<PL.P.measures[i+1].t-1e-6)); return PL.P.pickup?mi:mi+1; };
  const nm=ms=>[...ms].map(m=>midiName(m).replace('#','♯')).join('+');
  const list=probs.slice(0,6).map(({g,r})=>`<li>第 ${mno(g.t)} 小节：${r.st==='miss'?'漏了 '+nm(g.req):'应该 '+nm(g.req)+(r.on&&r.on.top.length?'，听到像 '+nm(r.on.top.slice(0,g.req.size)):'')}</li>`).join('');
  const whole=PL.secA===0&&PL.secB===PL.P.measures.length-1;
  const sug=pct>=92&&bpm&&bpm>=PL.song.bpm*.9?3:pct>=80?2:1;
  logToday('p'); save();
  modal(`<h3>录音评测：${pct}%</h3><p class="muted">谱上 ${groups.length} 个音（${PL.hands==='B'?'双手':PL.hands==='L'?'左手':'右手'}），弹对 ${ok} 个${bpm?`，你的速度约 ♩=${bpm}（原速 ${PL.song.bpm}）`:''}。谱子上绿色是弹对的，红色是有问题的。</p>
    ${list?`<ul style="margin:12px 0;padding-left:20px;font-size:14px">${list}${probs.length>6?`<li>…还有 ${probs.length-6} 处</li>`:''}</ul>`:'<p style="margin:12px 0">全部弹对了！</p>'}
    <p class="muted" style="font-size:12px">识别靠的是录音里的音高，环境吵或手机离钢琴太远会影响结果，仅供参考。</p>
    <div class="mrow" style="margin-top:14px"><button class="btn" data-x>看谱子</button>${whole?`<button class="btn pri" data-rate>打分（建议 ${sug} 星）</button>`:''}</div>`,m=>{
      $('[data-x]',m).onclick=closeModal; const r=$('[data-rate]',m); if(r) r.onclick=()=>rateSong(PL.id,{title:'录音评测打分',text:`识别准确率 ${pct}%。`,suggest:sug}); });
}

/* 等待模式 */
function wmStart(fromT){
  plStop();
  const A=fromT!=null?fromT:secStart();
  const groups=groupsFor(secStart(),secEnd());
  clearMarks();
  let gi=groups.findIndex(g=>g.t>=A-1e-6); if(gi<0) gi=0;
  PL.wm={groups,gi,pressed:new Set(),hits:0,miss:0,skips:0,startGi:gi,t0:Date.now()};
  $('#plplay').innerHTML=ICON.play; $('#plplay').setAttribute('aria-label','重新开始等待模式');
  wmShow();
}
function wmShow(){
  const W=PL.wm, g=W.groups[W.gi]; if(!g) return;
  const P=PL.P; const cur=[...g.evs];
  P.evs.forEach(e=>{ if(!e.rest&&!handOn(e.hand)&&Math.abs(e.t-g.t)<1e-6) cur.push(e); });
  const ng=W.groups[W.gi+1]; PL.lastSig='';
  plHighlight(cur,ng?ng.evs:[],g.t,true);
  W.pressed.forEach(m=>{const k=PL.kb.keys.get(m); if(k) k.classList.add('good');});
  const total=W.groups.length-W.startGi, done=W.gi-W.startGi;
  const hint=MIC.on?'正在听：在钢琴上弹亮起的键，听对了自动前进':(MIDI.n?'弹电钢琴':'点屏幕键盘或用电脑键盘')+'按亮起的键；用真钢琴可以打开“听我弹”，或按空格 /“下一步”';
  const sh=g.evs.find(e=>e.shift);
  const shTip=sh?`<br><span style="font-size:13px;color:var(--accent)">注意换手位：${sh.hand==='R'?'右手':'左手'}用 ${sh.notes.map(n=>n.f).join('、')} 指弹 ${sh.notes.map(n=>keyLabel(n.midi,PG.settings.label||'name',PL.P.doPc||0)).join('、')}，虚线圈是其他手指该放的位置</span>`:'';
  $('#plstatus').innerHTML=`<span class="msg"><b>等待模式</b> · 第 <b class="num">${done+1}</b> / ${total} 个 · 错 <b class="num">${W.miss}</b> 次${shTip}<br><span class="muted" style="font-size:13px">${hint}</span></span><button class="btn" id="wmnext">下一步 ›</button>`;
  $('#wmnext').onclick=()=>wmAdvance(true);
}
function plNote(m,on,src){
  if(!on||PL.mode!=='wait'||!PL.wm) return;
  const W=PL.wm, g=W.groups[W.gi]; if(!g) return;
  if(g.req.has(m)){ if(!W.pressed.has(m)){ W.pressed.add(m); const k=PL.kb.keys.get(m); if(k) k.classList.add('good'); }
    if([...g.req].every(x=>W.pressed.has(x))){ W.hits++; setTimeout(()=>wmAdvance(false),90); } }
  else { W.miss++; kbFlash(PL.kb,m,'bad'); const gg=PL.gs[g.evs[0].i]; if(gg){gg.classList.add('no'); setTimeout(()=>gg.classList.remove('no'),300);}
    const s=$('#plstatus .msg b:nth-of-type(3)'); if(s) s.textContent=W.miss; }
}
function wmAdvance(skip){
  const W=PL.wm; if(!W) return; const g=W.groups[W.gi]; if(!g) return;
  if(skip) W.skips++;
  PL.kb.keys.forEach(k=>k.classList.remove('good'));
  // 伴奏：另一只手在这一拍到下一拍之间的音
  const ng=W.groups[W.gi+1]; const tEnd=ng?ng.t:secEnd();
  if(PL.acc&&PL.hands!=='B'&&!MIC.on){ const now=audio().currentTime+.01;
    PL.P.evs.forEach(e=>{ if(!e.rest&&!handOn(e.hand)&&e.t>=g.t-1e-6&&e.t<tEnd-1e-6) e.notes.forEach(n=>tone(n.midi,now+(e.t-g.t)*.25,Math.min(1.6,e.d*.6),.5)); }); }
  if(skip&&PL.demo&&!MIC.on) g.evs.forEach(e=>e.notes.forEach(n=>tone(n.midi,audio().currentTime+.01,.5,.6)));
  W.pressed.clear(); W.gi++;
  if(W.gi>=W.groups.length){ wmDone(); return; }
  wmShow();
}
function wmDone(){
  const W=PL.wm; const secs=Math.round((Date.now()-W.t0)/1000);
  logToday('p'); save();
  const whole=PL.secA===0&&PL.secB===PL.P.measures.length-1;
  const acc=W.hits+W.miss?Math.round(W.hits/(W.hits+W.miss)*100):0;
  const autoOK=W.skips===0;
  PL.wm=null; PL.startBeat=secStart();
  if(!whole){ toast(autoOK?`这一段完成！准确率 ${acc}%`:'这一段完成！'); wmStart(); return; }
  const sug=autoOK?(acc>=95?2:1):undefined;
  rateSong(PL.id,{title:'找音完成！',text:autoOK?`用时 ${Math.floor(secs/60)} 分 ${secs%60} 秒，准确率 ${acc}%（错 ${W.miss} 次）。等待模式最多建议 2 星；想拿 3 星，用跟随模式按原速弹下来。`:`用时 ${Math.floor(secs/60)} 分 ${secs%60} 秒。按你在钢琴上的真实感受打分吧。`,suggest:sug});
  wmStart();
}

const RHY=[

function drRhythm(lv){
  const bpm=[72,80,84][lv]; const pats=shuffle(RHY[lv]).slice(0,6).concat(shuffle(RHY[lv])).slice(0,6);
  let qi=0; const scores=[]; const g=$('#dgame');
  let state=null; const timers=[];
  const show=()=>{
    const seq=pats[qi];
    g.innerHTML=`<div class="scoreline"><span><b>${qi+1}/6</b>题目</span><span><b>${bpm}</b>速度</span></div><div class="staffbox" style="width:100%"><div class="score" id="dst" style="width:100%"></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="rlisten">${ICON.speaker}先听一遍</button><button class="btn pri" id="rgo">${ICON.play}我来拍</button></div><button class="tap" id="rtap" disabled>听完预备拍后，在这里拍<br><small style="font-size:13px;font-weight:400">（电脑可按空格）</small></button><div class="muted" id="rres" style="min-height:24px"></div>`;
    const P=prepSimple(seq,{time:[4,4]});
    renderScore($('#dst'),P,{width:Math.min(520,$('#dst').clientWidth||520),s:11,interactive:false,barNums:false,tight:true});
    $('#rlisten').onclick=()=>playSeq(seq,bpm,{countIn:4,metro:4});
    $('#rgo').onclick=()=>go(seq,P);
  };
  const go=(seq,P)=>{
    stopSeq(); const ctx=audio(); const spb=60/bpm; const t0=ctx.currentTime+.15+4*spb;
    for(let k=0;k<8;k++) click(t0-4*spb+k*spb,k%4===0);
    const exp=P.evs.filter(e=>!e.rest).map(e=>t0+e.t*spb);
    state={taps:[],t0,exp,end:t0+4*spb};
    const tap=$('#rtap'); tap.disabled=false; tap.classList.add('live'); $('#rgo').disabled=true; $('#rlisten').disabled=true;
    const doTap=()=>{ if(!state) return; const t=audio().currentTime-outLat(); state.taps.push(t); tone(83,audio().currentTime,.08,.4); tap.classList.add('hit'); setTimeout(()=>tap.classList.remove('hit'),90); };
    tap.onpointerdown=e=>{e.preventDefault();doTap();};
    HOTKEY=e=>{ if(e.code==='Space'||e.code==='Enter'){e.preventDefault();doTap();return true;} return false; };
    timers.push(setTimeout(()=>evaluate(),(state.end-ctx.currentTime)*1000+350));
  };
  const evaluate=()=>{
    HOTKEY=null; const s=state; state=null; if(!s) return;
    const used=new Set(); let sum=0;
    s.exp.forEach(t=>{ let best=-1,bd=1; s.taps.forEach((x,i)=>{ if(used.has(i)) return; const d=Math.abs(x-t); if(d<bd){bd=d;best=i;} });
      let sc=0; if(best>=0&&bd<=.24){ used.add(best); sc=bd<=.075?100:bd<=.15?75:40; } sum+=sc; });
    const extra=s.taps.length-used.size; let score=Math.round(Math.max(0,sum/s.exp.length-extra*15));
    scores.push(score);
    $('#rtap').disabled=true; $('#rtap').classList.remove('live');
    $('#rres').innerHTML=`本题 <b class="num" style="color:var(--ink);font-size:20px">${score}</b> 分 · ${score>=90?'很稳！':score>=70?'不错，再稳一点':'跟着节拍器数“1 哒 2 哒”再试试'}${extra>0?`（多拍了 ${extra} 下）`:''}`;
    const nb=el(`<button class="btn pri">${qi<5?'下一题':'看总分'}</button>`); $('#rres').after(nb);
    nb.onclick=()=>{ qi++; if(qi<6) show(); else drillDone('rhythm',lv,Math.round(scores.reduce((a,b)=>a+b,0)/6),'6 题平均分。节奏感是可以练出来的：拍的时候嘴里跟着数。'); };
    const again=el(`<button class="btn">重拍这题</button>`); nb.after(again); again.onclick=()=>{scores.pop(); show();};
  };
  show();
  DG.stop=()=>{timers.forEach(clearTimeout); HOTKEY=null; stopSeq();};
}

      setTimeout(()=>{ delete g.dataset.lock; qi++; if(qi<10) show(); else drillDone('ear',lv,right*10,`10 题答对 ${right} 题。耳朵越练越灵，弹琴时也更容易听出错音。`); },1100); };

  DG.stop=()=>{stopSeq(); delete g.dataset.lock;};
}

/* ================= 启动 ================= */
// 私人导入链接：网址 #qt= 后面带着曲子数据，打开一次就存进本机的“我的曲库”。
// 曲子只在这个链接里，不在公开的网页文件里。
function importFromHash(){
  try{ const b=location.hash.slice(4).replace(/-/g,'+').replace(/_/g,'/');
    const raw=JSON.parse(decodeURIComponent(escape(atob(b)))), inc=sanitize(raw);
    // target：放进哪位学习者的曲库（例如孩子）；remove：从谁的曲库里拿掉
    let target=WHO;
    if(raw.target){ let p=PROFILES.list.find(x=>x.id===raw.target)||PROFILES.list.find(x=>x.kid);
      if(!p){ p={id:'kid',name:'孩子',kid:true}; PROFILES.list.push(p); saveProfiles(); } target=p.id; }
    const stamp=Date.now();
    Object.entries(raw.remove||{}).forEach(([pid,ids])=>{ if(pid===target||!PROFILES.list.some(p=>p.id===pid)) return;
      const data=pid===WHO?PG:loadPG(pid); ids.forEach(id=>{ data.custom[id]={deleted:true,at:stamp}; });
      if(pid===WHO){ PG=data; save(); } else { data.updated=stamp; try{localStorage.setItem(lsKey(pid),JSON.stringify(data));}catch(_){} } });
    const n=Object.keys(inc.custom).length, name=PROFILES.list.find(p=>p.id===target).name;
    if(target===WHO){ PG=merge(PG,inc); save(); syncCustom(); toast(`已把 ${n} 首曲子放进“${name}”的曲库`); }
    else{ const data=merge(loadPG(target),inc); data.updated=stamp; try{localStorage.setItem(lsKey(target),JSON.stringify(data));}catch(_){}
      syncCustom(); setTimeout(()=>switchProfile(target).then(()=>toast(`已把 ${n} 首曲子放进“${name}”的曲库，现在是“${name}”在练习`)),0); }
  }catch(err){ console.warn(err); toast('导入链接不完整，请重新复制整条链接'); }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){}
}
(function boot(){
  const h=(location.hash||'').slice(1); if(['map','learn','drills','me'].includes(h)) TAB=h;
  syncCustom();
  if(STANDALONE&&location.hash.startsWith('#qt=')) importFromHash();
  renderMain();
  initCloud();
  window.addEventListener('blur',()=>{ if(INPUT.kb) INPUT.kb.voices.forEach((v,m)=>kbUp(INPUT.kb,m)); });
})();
</script>
