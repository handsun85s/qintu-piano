<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="琴途">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.QT_STANDALONE=true</script>
</head>
<body>
<title>琴途钢琴闯关</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Noto+Serif+SC:wght@600;900&display=swap" media="print" onload="this.media='all'">
<style>
/* 布局：左侧导航（手机为底部标签栏）+ 主内容；练琴/上课/训练为全屏“舞台”覆盖层。
   色彩取自钢琴本身：乌木黑、象牙白、琴槌毡的绯红、铜踏板的金。 */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface2:#F5F6F8; --ink:#15171C; --muted:#5C6371; --line:#D4D8DF;
  --accent:#AE1F3A; --accent-ink:#FFFFFF; --accent-soft:#F6E4E8;
  --gold:#A87A1E; --gold-soft:#F5EBD5;
  --rh:#C2203F; --lh:#13798A; --rh-soft:#F8DCE2; --lh-soft:#D6EEF1;
  --ok:#23804F; --bad:#C2410C;
  --ivory:#FCFCFA; --ivory-edge:#C9CDD4; --ebony:#16181D; --staff:#8A909C;
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Noto Serif SC",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-music:"Noto Music","Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --surface:#161920; --surface2:#1C2028; --ink:#ECEEF2; --muted:#9AA1AD; --line:#2A2F39;
  --accent:#E5506A; --accent-ink:#16090C; --accent-soft:#3A1820;
  --gold:#E3B654; --gold-soft:#3A2F17;
  --rh:#F2627C; --lh:#46C0D2; --rh-soft:#43202A; --lh-soft:#163A41;
  --ok:#4CC383; --bad:#F08A4B;
  --ivory:#E6E6E1; --ivory-edge:#8F949C; --ebony:#050608; --staff:#6E7584;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --surface:#161920; --surface2:#1C2028; --ink:#ECEEF2; --muted:#9AA1AD; --line:#2A2F39;
  --accent:#E5506A; --accent-ink:#16090C; --accent-soft:#3A1820;
  --gold:#E3B654; --gold-soft:#3A2F17;
  --rh:#F2627C; --lh:#46C0D2; --rh-soft:#43202A; --lh-soft:#163A41;
  --ok:#4CC383; --bad:#F08A4B;
  --ivory:#E6E6E1; --ivory-edge:#8F949C; --ebony:#050608; --staff:#6E7584;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
.gold{color:var(--gold)}

/* ===== 外框 ===== */
.app{min-height:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.brand{display:none}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:12px}
.nav-btn svg{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:var(--accent)}
.nav-lv{display:none}
main{padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin:0 auto}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px 1fr}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 14px}
  .brand{display:block;padding:0 10px 22px}
  .brand b{font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.06em}
  .brand span{display:block;color:var(--muted);font-size:12px;letter-spacing:.12em}
  .nav-btn{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;justify-content:flex-start}
  .nav-btn[aria-current="page"]{background:var(--accent-soft)}
  .nav-lv{display:block;margin-top:auto;padding:14px;border-radius:12px;background:var(--surface2);font-size:13px}
  main{padding-block:32px 48px;width:100%}
}
.page-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:26px;font-weight:900}
.page-h p{color:var(--muted)}
.section-t{font-family:var(--f-display);font-size:19px;font-weight:900;margin:28px 0 12px}

/* ===== 卡片与通用控件 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stars{color:var(--gold);letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars .off{color:var(--line)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.rh{background:var(--rh-soft);color:var(--rh)}
.pill.lh{background:var(--lh-soft);color:var(--lh)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}

/* ===== 首页 ===== */
.hero{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.hero{grid-template-columns:1.35fr 1fr}}
.lvcard{background:var(--ebony);color:#F2F0EA;border-radius:18px;padding:20px;position:relative;overflow:hidden}
.lvcard .eyebrow{font-size:12px;letter-spacing:.16em;color:#B9B4A8}
.lvrow{display:flex;align-items:baseline;gap:14px;margin-top:6px;flex-wrap:wrap}
.lvnum{font-family:var(--f-num);font-size:64px;line-height:.9;font-weight:700;color:#E8C46A}
.lvname{font-family:var(--f-display);font-size:24px;font-weight:900}
.xpkeys{display:flex;height:64px;margin-top:16px;gap:2px;position:relative}
.xpkeys i{flex:1;background:#E9E6DD;border-radius:0 0 4px 4px;position:relative}
.xpkeys i.lit{background:linear-gradient(#F3D27A,#D9A73B)}
.xpkeys b{position:absolute;top:0;width:calc(100%/15*.58);height:60%;background:#0B0C0F;border-radius:0 0 3px 3px;z-index:2}
.xptxt{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#C9C4B8}
.today{display:flex;flex-direction:column;gap:12px}
.statrow{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;font-size:14px}
.task .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done span{color:var(--muted);text-decoration:line-through}
.next-card{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.next-card h3{font-size:20px}
.world{margin-top:30px}
.world-h{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.roman{font-family:var(--f-num);font-style:italic;font-size:40px;line-height:1;color:var(--accent);min-width:56px}
.world-h h2{font-size:21px;font-weight:900}
.world-h p{font-size:13px;color:var(--muted)}
.world-h .wstars{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.learnlinks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 12px 70px;font-size:13px;color:var(--muted)}
.learnlinks button{border:0;background:var(--surface2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink)}
.learnlinks button.done{color:var(--muted);text-decoration:line-through}
@media (max-width:520px){.learnlinks{margin-left:0}}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.song{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:150px;position:relative;transition:transform .15s,border-color .15s}
.song:hover{transform:translateY(-2px);border-color:var(--muted)}
.song .idx{font-family:var(--f-num);font-size:13px;color:var(--muted);font-weight:700}
.song h3{font-size:18px;font-weight:900}
.song .meta{font-size:12px;color:var(--muted)}
.song .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.diff{display:flex;gap:3px}
.diff i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.diff i.on{background:var(--accent)}
.song.boss{background:var(--ebony);color:#F2F0EA;border-color:#6F5A2A}
.song.boss .meta,.song.boss .idx{color:#B9B4A8}
.song.boss .tag{position:absolute;top:12px;right:12px;font-size:11px;letter-spacing:.14em;color:#E8C46A;border:1px solid #6F5A2A;border-radius:999px;padding:0 8px}
.song.boss .stars .off{color:#3B3E45}
.song.addsong{border-style:dashed;align-items:flex-start;justify-content:center;background:transparent}
.song.addsong .plus{font-size:28px;line-height:1;color:var(--accent)}
.song.locked{opacity:.5}
.song.kidhanon{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.whochip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px}
.whochip:hover{border-color:var(--muted)}
.whoav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;flex:none}
.whoav.kid{background:var(--gold);color:#1a1405}
.wholist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.whorow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.whorow.cur{border-color:var(--ok)}
.whoname{flex:1;min-width:0;display:flex;flex-direction:column}
.whoname input{font:inherit;font-weight:600;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:2px 0;width:100%}
.whoname input:focus{outline:none;border-bottom-color:var(--accent)}
.jp-help{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 14px;line-height:1.8}
.jp-help code{font-family:ui-monospace,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.jp-area{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.jp-area{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:15px;line-height:1.7;resize:vertical}
.jp-err{font-size:13px;color:var(--bad)}
.jp-ok{font-size:13px;color:var(--ok)}
.song.locked:hover{transform:none}
.lockmsg{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:-4px 0 10px 70px}
@media (max-width:520px){.lockmsg{margin-left:0}}

/* ===== 学习 ===== */
.chapter{margin-bottom:22px}
.chapter-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.chapter-h h2{font-size:19px;font-weight:900}
.lessons{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lesson{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lesson:hover{border-color:var(--muted)}
.lesson .no{font-family:var(--f-num);font-weight:700;color:var(--muted);min-width:28px}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-weight:600}
.lesson .t span{font-size:12px;color:var(--muted)}
.lesson .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.lesson.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}

/* ===== 训练场 ===== */
.drills{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.drill{display:flex;flex-direction:column;gap:10px}
.drill .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.drill .ic svg{width:26px;height:26px}
.drill h3{font-size:19px}
.drill p{font-size:14px;color:var(--muted)}
.drill .best{font-size:13px}

/* ===== 我的 ===== */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.heat i.l3{background:var(--accent);border-color:var(--accent)}
.ach{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px dashed var(--line)}
.badge .medal{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;background:var(--surface2);color:var(--muted)}
.badge.got{border-style:solid;background:var(--surface)}
.badge.got .medal{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.badge b{display:block;font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow .l b{display:block;font-weight:600}
.setrow .l span{font-size:13px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)}
.sync.busy i{background:var(--gold)}

/* ===== 舞台（全屏练习） ===== */
#stage{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage[hidden]{display:none}
body.staged{overflow:hidden}
.st-head{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.st-title{flex:1;min-width:0}
.st-title b{display:block;font-family:var(--f-display);font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-title span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-body{flex:1;overflow:auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.st-inner{max-width:760px;margin:0 auto}

/* 练琴器 */
.pl-tools{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.playbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.playbtn svg{width:20px;height:20px}
.tempo{display:flex;align-items:center;gap:8px;font-size:13px}
.tempo input{width:110px;accent-color:var(--accent)}
.tempo .num{min-width:58px}
.micbtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.heard{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-variant-numeric:tabular-nums;min-width:84px}
.heard i{width:6px;height:22px;border-radius:3px;background:var(--surface2);position:relative;overflow:hidden;--lv:0}
.heard i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--lv)*100%);background:var(--ok)}
.pl-more{display:none;gap:8px 14px;flex-wrap:wrap;align-items:center;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface2);font-size:13px}
.pl-more.open{display:flex}
.pl-more label{display:inline-flex;align-items:center;gap:6px}
.pl-more select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tip{font-size:13px;color:var(--muted);padding:8px 12px;background:var(--surface2);border-radius:10px;margin:10px auto 0;max-width:1000px}
.tip b{color:var(--ink)}
.pl-score{flex:1;overflow:auto;padding-block:8px 16px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));position:relative}
.pl-score .sheet{max-width:1100px;margin:10px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px}

<script>
'use strict';
/* ================= 工具 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=v=>Math.round(v*10)/10;
const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  restart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
  lock:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 10h18M3 14h18M3 18h18" opacity=".45"/><ellipse cx="10" cy="14" rx="3" ry="2.2" fill="currentColor" transform="rotate(-20 10 14)"/><path d="M12.8 13.2V4"/></svg>',
  keys:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M8.5 4v16M14.5 4v16"/><rect x="6.5" y="4" width="3.5" height="9" fill="currentColor"/><rect x="13" y="4" width="3.5" height="9" fill="currentColor"/></svg>',
  drum:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h2l2-6 3 12 3-9 2 3h4"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 3-2 4-3 5.5S14 18 12 20s-5 1-5-1"/><path d="M10 10a2 2 0 1 1 4 0c0 1.5-2 2-2 3.5"/></svg>'
};

/* ================= 乐理基础 ================= */
const LET='CDEFGAB', LSEMI=[0,2,4,5,7,9,11];
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
function parsePitch(s){
  const m=/^([A-G])(#|b)?(-?\d)$/.exec(s); if(!m) throw new Error('音高写错了: '+s);
  const L=m[1], acc=m[2]||'', oct=+m[3], li=LET.indexOf(L);
  return {name:s,L,acc,oct,di:oct*7+li,midi:(oct+1)*12+LSEMI[li]+(acc==='#'?1:acc==='b'?-1:0)};
}
function parseDur(s){ if(s.includes(':')){const [a,b]=s.split(':');return +a/+b;} return parseFloat(s); }
function parseSeq(str,hand){
  const evs=[], bars=[]; let t=0;
  for(const tok of str.trim().split(/\s+/)){
    if(!tok) continue;
    if(tok==='|'){bars.push(t);continue;}
    const [main,fing]=tok.split('@'); const [p,d]=main.split('/'); const dur=d?parseDur(d):1;
    if(p==='r') evs.push({hand,t,d:dur,rest:true,notes:[]});
    else{
      const notes=p.split('+').map(parsePitch);
      if(fing) notes.forEach((n,i)=>{n.f=fing[i]?+fing[i]:null;});
      evs.push({hand,t,d:dur,notes});
    }
    t+=dur;
  }
  return {evs,end:t,bars};
}
const NAMES_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const JP=['1','♯1','2','♯2','3','4','♯4','5','♯5','6','♭7','7'];
const SOL=['do','♯do','re','♯re','mi','fa','♯fa','sol','♯sol','la','♭si','si'];
const SOLW={C:'do',D:'re',E:'mi',F:'fa',G:'sol',A:'la',B:'si'};
const JPW={C:'1',D:'2',E:'3',F:'4',G:'5',A:'6',B:'7'};
function labelOf(n,mode,doPc){
  if(mode==='name') return {t:n.L+(n.acc==='#'?'♯':n.acc==='b'?'♭':''),dots:0};
  const rel=((n.midi-doPc)%12+12)%12;
  if(mode==='sol') return {t:SOL[rel],dots:0};
  return {t:JP[rel],dots:Math.floor((n.midi-(60+doPc))/12)};
}
function keyLabel(m,mode,doPc){
  const pc=((m%12)+12)%12;
  if(mode==='name') return NAMES_SHARP[pc].replace('#','♯');
  const rel=((m-doPc)%12+12)%12;
  if(mode==='sol') return SOL[rel];
  if(mode==='jp'){const d=Math.floor((m-(60+doPc))/12);return JP[rel]+(d>0?'˙'.repeat(d):d<0?'.'.repeat(-d):'');}
  return '';
}
const midiName=m=>NAMES_SHARP[((m%12)+12)%12]+(Math.floor(m/12)-1);

/* ================= 曲库 ================= */

/* ================= 儿童手指操 · 哈农 =================
   哈农（C.-L. Hanon）《钢琴技巧练习》1873 年出版，早已进入公有领域。
   这里按儿童教材的思路改编：C 五指位置开始、慢速、先单手后双手、一条一条往上练。
   每条练习的音型（以白键音级计）和经典指法：右手上行 / 左手上行；下行时左右手指法互换（镜像）。 */
const HANON_PAT=[
  {no:1,off:[0,2,3,4,5,4,3,2],rh:[1,2,3,4,5,4,3,2],lh:[5,4,3,2,1,2,3,4]},
  {no:2,off:[0,2,5,4,3,4,3,2],rh:[1,2,5,4,3,4,3,2],lh:[5,4,1,2,3,2,3,4]},
  {no:3,off:[0,2,5,4,3,2,3,4],rh:[1,2,5,4,3,2,3,4],lh:[5,4,1,2,3,4,3,2]}
];
const wkName=w=>LET[((w%7)+7)%7]+Math.floor(w/7);
function hanonHand(p,hand){
  const shift=hand==='R'?0:-7, bars=[];
  // 上行：从 C 起，依次从 C D E F G 开始；下行：从 G 起，依次从 G F E D C 开始
  [28,29,30,31,32].forEach(st=>bars.push(p.off.map((o,i)=>wkName(st+o+shift)+'/.5@'+(hand==='R'?p.rh:p.lh)[i]).join(' ')));
  [39,38,37,36,35].forEach(st=>bars.push(p.off.map((o,i)=>wkName(st-o+shift)+'/.5@'+(hand==='R'?p.lh:p.rh)[i]).join(' ')));
  bars.push(wkName(28+shift)+'/4@'+(hand==='R'?1:5));
  return bars.join(' | ');
}

/* 曲谱解析（带缓存） */
function prepSong(song){
  if(song._p) return song._p;
  const [num,den]=song.time; const bar=num*4/den; const pickup=song.pickup||0;
  const R=parseSeq(song.rh,'R'), L=song.lh?parseSeq(song.lh,'L'):null;
  const end=Math.max(R.end,L?L.end:0);
  [R,L].forEach(X=>{ if(!X) return; X.bars.forEach(b=>{const k=(b-pickup)/bar; if(Math.abs(k-Math.round(k))>1e-6) console.warn('[琴途] 小节线没对齐',song.id,X===R?'右手':'左手','拍位',b);}); });
  if(L && Math.abs(R.end-L.end)>1e-6) console.warn('[琴途] 左右手长度不同',song.id,R.end,L.end);
  const P=buildP({evs:[...R.evs,...(L?L.evs:[])],bar,pickup,end,time:song.time,keySig:song.keySig||0,doPc:song.doPc||0,
    staves:L?[{clef:'treble',hand:'R'},{clef:'bass',hand:'L'}]:[{clef:'treble',hand:'R'}],showTime:true});
  autoFinger(P,'R'); if(L) autoFinger(P,'L'); P.hasFingers=true;
  song._p=P; return P;
}

/* ================= 自动指法 =================
   依据：Parncutt, Sloboda, Clarke, Raekallio & Desain (1997)
   《An Ergonomic Model of Keyboard Fingering for Melodic Fragments》, Music Perception 14(4)。
   该模型把巴赫、图尔克、车尔尼等历代指法原则整理成 12 条“难度规则”，
   对每种可能的指法打分，用动态规划找总分最低（最顺手）的一种。这里完整实现这 12 条规则：
     1 Stretch 超出舒适跨度   2 Small-Span 手指挤在一起   3 Large-Span 手指撑开
     4/5 Position-Change 换手位的次数与距离（看隔一个音的两个音）
     6 Weak-Finger 少用 4、5 指   7 Three-Four-Five 3/4/5 指连用   8 Three-to-Four 3 指后接 4 指
     9 Four-on-Black 3 白 4 黑    10 Thumb-on-Black 拇指弹黑键   11 Five-on-Black 小指弹黑键
     12 Thumb-Passing 穿指/跨指时的黑白键高度
   在原模型之上，按初学者教学习惯补了三点：
     · 同一个音连弹，默认用同一根手指；
     · 同样的乐句重复出现，用同一套指法（先算第一次，后面照抄）；
     · 有休止或长音时，换手位的代价减半（有时间准备）；
     · 原模型针对熟练钢琴家；初学者以“五指位置”为本，所以弱指（4、5 指）和 3→4 的扣分调低，同音换指的扣分调高。
   左手是右手的镜像（音程取反）。谱上已写好的指法保持不变。 */
// 表 1：右手各对手指的跨度（半音）：MinPrac, MinComf, MinRel, MaxRel, MaxComf, MaxPrac
const SPAN_T={'1,2':[-5,-3,1,5,8,10],'1,3':[-4,-2,3,7,10,12],'1,4':[-3,-1,5,9,12,14],'1,5':[-1,1,7,10,13,15],
  '2,3':[1,1,1,2,3,5],'2,4':[1,1,3,4,5,7],'2,5':[2,2,5,6,8,10],'3,4':[1,1,1,2,2,4],'3,5':[1,1,3,4,5,7],'4,5':[1,1,1,2,3,5]};
// a→b 两指的跨度限制（a>b 时取反并对调上下限）
function spanLim(a,b){
  if(a<b){ const t=SPAN_T[a+','+b]; return {minPrac:t[0],minComf:t[1],minRel:t[2],maxRel:t[3],maxComf:t[4],maxPrac:t[5]}; }
  const t=SPAN_T[b+','+a]; return {minPrac:-t[5],minComf:-t[4],minRel:-t[3],maxRel:-t[2],maxComf:-t[1],maxPrac:-t[0]};
}
const FW={weak:.25,threeToFour:.5,repeatChange:3}; // 初学者权重（见上）
const whiteIdx=m=>Math.floor(m/12)*7+[0,0,1,1,2,3,3,4,4,5,5,6][((m%12)+12)%12];
// 相邻两音（规则 1、2、3、8、9、12 + 同指 / 同音处理）。d 已按左右手统一成“右手方向”的音程
function pairCost(a,b,d,pB,qB,gap,durA,fromChord){
  // 前一个音是长音（≥1.5 拍）时，手有时间提前挪位，按有休止处理
  if(durA>=1.5) gap=Math.max(gap,.5);
  // 同一根手指弹两个不同的音：原模型不允许；初学者只在长音后挪一两个键时可以接受
  if(a===b){ if(d===0) return 0; if(Math.abs(d)<=2&&durA>=2&&!fromChord) return 2; const c=15+Math.abs(d); return gap>=.5?c*.5:c; }
  if(d===0) return FW.repeatChange;                    // 同一个音换手指弹
  const L=spanLim(a,b), thumb=a===1||b===1, k=thumb?1:2;
  let c=0;
  // 超出这两根手指能够到的范围：只能抬手跳过去，按“跳跃”单独计分
  if(d<L.minPrac||d>L.maxPrac){ const over=d<L.minPrac?L.minPrac-d:d-L.maxPrac; const j=10+over; return gap>=.5?j*.5:j; }
  c+=2*Math.max(0,d-L.maxComf)+2*Math.max(0,L.minComf-d);        // 1 Stretch
  c+=k*Math.max(0,L.minRel-d);                                    // 2 Small-Span
  c+=k*Math.max(0,d-L.maxRel);                                    // 3 Large-Span
  if(a===3&&b===4) c+=FW.threeToFour;                             // 8 Three-to-Four
  if((a===3&&b===4&&!pB&&qB)||(a===4&&b===3&&pB&&!qB)) c+=1;      // 9 Four-on-Black
  const pass=(b===1&&a>1&&d>0)||(a===1&&b>1&&d<0);                // 12 Thumb-Passing
  if(pass){ const tB=a===1?pB:qB, oB=a===1?qB:pB; if(tB===oB) c+=1; else if(tB&&!oB) c+=3; }
  return c;
}
// 单个音（规则 6、10、11）
function noteCost(f,B,prevB,nextB){
  let c=0;
  if(f===4||f===5) c+=FW.weak;                                   // 6 Weak-Finger
  if(f===1&&B) c+=1+(prevB===false?2:0)+(nextB===false?2:0);      // 10 Thumb-on-Black
  if(f===5&&B) c+=(prevB===false?2:0)+(nextB===false?2:0);        // 11 Five-on-Black
  return c;
}
// 隔一个音（规则 4、5、7）
function tripleCost(f1,f2,f3,p1,p2,p3,sgn,slow){
  let c=0;
  const s=new Set([f1,f2,f3]); if(s.size===3&&s.has(3)&&s.has(4)&&s.has(5)) c+=1;   // 7 Three-Four-Five
  const D=sgn*(p3-p1);
  if(f1===f3){ if(D!==0) c+=2+Math.abs(D); }
  else if(D===0){ c+=1; }                                         // 隔一个音的同音换指算半次换位
  else{ const L=spanLim(f1,f3);
    if(D>L.maxComf||D<L.minComf){
      const between=(p2-p1)*(p2-p3)<0;
      const full=f2===1&&between&&(D>L.maxPrac||D<L.minPrac);
      c+=(full?2:1)+(D>L.maxComf?D-L.maxComf:L.minComf-D); } }      // 4 Count + 5 Size
  return slow?c*.5:c;
}
// 和弦按教材的固定指法（音从低到高）
function chordFingers(ms,hand){
  const n=ms.length, sp=ms[n-1]-ms[0];
  let f;
  if(n===2) f=sp<=2?[2,3]:sp<=4?[1,3]:sp<=6?[1,4]:[1,5];
  else if(n===3){ const lo=ms[1]-ms[0], up=ms[2]-ms[1], stacked=lo>=3&&lo<=4&&up>=3&&up<=4;
    f=hand==='R'?(stacked||lo>=up?[1,3,5]:[1,2,5]):(stacked||up>=lo?[1,3,5]:[1,2,5]); }
  else f=[1,2,3,5].slice(0,n);
  return hand==='R'?f:f.slice().reverse();
}
function fingerDP(items,sgn){
  const N=items.length;
  const opts=items.map(it=>it.notes.length>1?[it.chord]:(it.notes[0].f?[[it.notes[0].f]]:[[1],[2],[3],[4],[5]]));
  const rep=(it,f,other)=>{ // 和弦用离另一组最近的那个音做代表
    if(it.notes.length===1) return {m:it.notes[0].midi,f:f[0]};
    let best=0, bd=Infinity; it.notes.forEach((n,k)=>{ const d=Math.abs(n.midi-other); if(d<bd){bd=d;best=k;} });
    return {m:it.notes[best].midi,f:f[best]}; };
  const blk=it=>it.notes.length===1?isBlack(it.notes[0].midi):null;
  const node=(i,f)=>items[i].notes.length>1?0:noteCost(f[0],blk(items[i]),i>0?blk(items[i-1]):null,i<N-1?blk(items[i+1]):null);
  const step=(i,fa,fb)=>{ const A=items[i-1],B=items[i]; const ca=A.notes.length>1?(A.notes.reduce((s,n)=>s+n.midi,0)/A.notes.length):A.notes[0].midi;
    const ra=rep(A,fa,B.notes[0].midi), rb=rep(B,fb,ca);
    return pairCost(ra.f,rb.f,sgn*(rb.m-ra.m),isBlack(ra.m),isBlack(rb.m),B.t-A.end,A.end-A.t,A.notes.length>1); };
  // 状态 = (上一个音的指法, 这个音的指法)
  let layer=new Map(); opts[0].forEach((f,j)=>layer.set('-|'+j,{c:node(0,f),back:null,pj:null,j}));
  const hist=[layer];
  for(let i=1;i<N;i++){ const nl=new Map();
    opts[i].forEach((fb,j)=>{ const nc=node(i,fb);
      layer.forEach((st,key)=>{ const fa=opts[i-1][st.j];
        let c=st.c+nc+step(i,fa,fb);
        if(i>=2&&st.pj!=null&&items[i].notes.length===1&&items[i-1].notes.length===1&&items[i-2].notes.length===1){
          const f1=opts[i-2][st.pj][0]; const slow=items[i].t-items[i-2].end>=1;
          c+=tripleCost(f1,fa[0],fb[0],items[i-2].notes[0].midi,items[i-1].notes[0].midi,items[i].notes[0].midi,sgn,slow); }
        const k2=st.j+'|'+j; const cur=nl.get(k2); if(!cur||c<cur.c) nl.set(k2,{c,back:key,pj:st.j,j}); }); });
    hist.push(nl); layer=nl; }
  let bestKey=null, best=Infinity; layer.forEach((st,k)=>{ if(st.c<best){best=st.c;bestKey=k;} });
  const pick=new Array(N); let key=bestKey;
  for(let i=N-1;i>=0;i--){ const st=hist[i].get(key); pick[i]=opts[i][st.j]; key=st.back; }
  return {pick,cost:best};
}
function autoFinger(P,hand){
  const items=[];
  P.evs.forEach(e=>{ if(e.rest||e.hand!==hand) return; const last=items[items.length-1];
    if(last&&Math.abs(last.t-e.t)<1e-6){ last.evs.push(e); return; } items.push({t:e.t,evs:[e]}); });
  if(!items.length) return;
  const sgn=hand==='R'?1:-1;
  items.forEach(it=>{ it.notes=it.evs.flatMap(e=>e.notes).sort((a,b)=>a.midi-b.midi); it.end=Math.max(...it.evs.map(e=>e.t+e.d));
    if(it.notes.length>1){ const f=chordFingers(it.notes.map(n=>n.midi),hand); it.chord=it.notes.map((n,k)=>n.f||f[k]); } });
  // 第一遍：整首算一次
  let R=fingerDP(items,sgn);
  // 第二遍：同样的小节（音、节奏都一样）用第一次出现时的指法
  const sig=new Map(), forced=new Map();
  items.forEach((it,i)=>{ const m=it.evs[0].m, t0=P.measures[m].t;
    const k=m+':'; it.sigPart=`${+(it.t-t0).toFixed(4)},${it.notes.map(n=>n.midi).join('+')},${+(it.end-it.t).toFixed(4)}`; it.mi=m; });
  const byBar=new Map(); items.forEach((it,i)=>{ if(!byBar.has(it.mi)) byBar.set(it.mi,[]); byBar.get(it.mi).push(i); });
  byBar.forEach((idx,m)=>{ const key=idx.map(i=>items[i].sigPart).join(' ');
    if(!sig.has(key)) sig.set(key,idx); else { const first=sig.get(key); idx.forEach((i,k)=>{ if(items[i].notes.length===1&&!items[i].notes[0].f) forced.set(i,R.pick[first[k]][0]); }); } });
  if(forced.size){ forced.forEach((f,i)=>{ items[i].notes[0].f=f; items[i].notes[0].fx=true; }); R=fingerDP(items,sgn); }
  items.forEach((it,i)=>{ it.notes.forEach((n,k)=>{ if(!n.f) n.f=R.pick[i][k]; }); });
  // 换手位提示：要穿指/跨指、同一根手指换键、或超出舒适跨度
  for(let i=1;i<items.length;i++){ const A=items[i-1], B=items[i]; if(A.notes.length>1||B.notes.length>1) continue;
    const p=A.notes[0], q=B.notes[0], d=sgn*(q.midi-p.midi); if(!d) continue;
    const a=p.f, b=q.f; let shift=a===b;
    if(!shift){ const L=spanLim(a,b); shift=(b===1&&a>1&&d>0)||(a===1&&b>1&&d<0)||d>L.maxComf||d<L.minComf; }
    if(shift) B.evs.forEach(e=>e.shift=true); }
  P.fingerCost=(P.fingerCost||0)+R.cost;
}
function buildP(o){
  const measures=[]; let ms=0;
  if(o.free){ measures.push({t:0,len:o.end}); }
  else{
    if(o.pickup>0){measures.push({t:0,len:o.pickup}); ms=o.pickup;}
    while(ms<o.end-1e-6){measures.push({t:ms,len:o.bar}); ms+=o.bar;}
  }
  const evs=o.evs.sort((a,b)=>a.t-b.t||(a.hand===b.hand?0:a.hand==='R'?-1:1));
  evs.forEach((e,i)=>{e.i=i; let mi=0; for(let k=0;k<measures.length;k++) if(measures[k].t<=e.t+1e-9) mi=k; e.m=mi;});
  const all=evs.filter(e=>!e.rest).flatMap(e=>e.notes.map(n=>n.midi));
  return {...o,measures,evs,lo:Math.min(...all),hi:Math.max(...all),hasFingers:evs.some(e=>e.notes.some(n=>n.f))};
}
function prepSimple(seq,opt={}){
  const clef=opt.clef||'treble', hand=clef==='bass'?'L':'R';
  const X=parseSeq(seq,hand);
  const time=opt.time||[4,4];
  return buildP({evs:X.evs,bar:time[0]*4/time[1],pickup:0,end:X.end,time,keySig:opt.keySig||0,doPc:opt.doPc||0,
    staves:[{clef,hand}],showTime:!!opt.time&&!opt.free,free:opt.free||!opt.time});
}

/* ================= 五线谱渲染 ================= */
const CLEFS={treble:{top:38,bot:30,mid:34,glyph:'𝄞'},bass:{top:26,bot:18,mid:22,glyph:'𝄢'}};
const KS_POS={'#':{treble:[38,35,39,36,33,37,34],bass:[24,21,25,22,19,23,20]},b:{treble:[34,37,33,36,32,35,31],bass:[20,23,19,22,18,21,17]}};
const ACCG={'#':'♯',b:'♭',n:'♮'};
function keyAccMap(ks){const m={};for(let i=0;i<Math.abs(ks);i++) m[(ks>0?'FCGDAEB':'BEADGCF')[i]]=ks>0?'#':'b';return m;}
const isDotted=d=>[3,1.5,.75,.375].some(v=>Math.abs(d-v)<1e-6);
const flagsOf=d=>d<.375+1e-6?2:d<1-1e-6?1:0;
const tkey=t=>Math.round(t*1e6)/1e6;

function renderScore(host,P,o){
  const s=o.s||9, W=Math.max(240,Math.floor(o.width||host.clientWidth||600));
  const kAcc=keyAccMap(P.keySig||0), nks=Math.abs(P.keySig||0), ksT=(P.keySig||0)>0?'#':'b';
  // 临时记号：同一小节内只标第一次
  P.staves.forEach(st=>P.measures.forEach((m,mi)=>{
    const carry={};
    P.evs.forEach(e=>{ if(e.m!==mi||e.hand!==st.hand||e.rest) return;
      e.notes.forEach(n=>{const k=n.L+n.oct; const exp=k in carry?carry[k]:(kAcc[n.L]||''); if(n.acc!==exp){n.show=n.acc||'n';carry[k]=n.acc;} else n.show='';}); });
  }));
  const MINW=s*(o.minW||2.6), BEATW=s*(o.beatW||4.2), LEAD=s*1.5, TAIL=s*.9;
  const mInfo=P.measures.map((m,mi)=>{
    const es=P.evs.filter(e=>e.m===mi);
    const ons=[...new Set(es.map(e=>tkey(e.t)))].sort((a,b)=>a-b);
    const pos=new Map(); let x=LEAD;
    ons.forEach((t,k)=>{const nt=k<ons.length-1?ons[k+1]:m.t+m.len;
      if(es.some(e=>tkey(e.t)===t&&e.notes.some(n=>n.show))) x+=s*1.1;
      pos.set(t,x); x+=Math.max(MINW,(nt-t)*BEATW);});
    return {pos,w:x+TAIL};
  });
  const clefW=s*4.1, ksW=nks?nks*s*1.0+s*.4:0, tsW=P.showTime?s*2.6:0;
  const hw0=clefW+ksW;
  const systems=[]; let cur={ms:[],hw:hw0+tsW,nat:0};
  P.measures.forEach((m,mi)=>{
    if(cur.ms.length && cur.hw+cur.nat+mInfo[mi].w>W-8){systems.push(cur);cur={ms:[],hw:hw0,nat:0};}
    cur.ms.push(mi); cur.nat+=mInfo[mi].w;
  });
  systems.push(cur);
  // 垂直尺寸
  const FR=(o.fingers&&P.hasFingers)?s*1.9:0;
  const stInfo=P.staves.map(st=>{
    const C=CLEFS[st.clef]; const es=P.evs.filter(e=>e.hand===st.hand&&!e.rest);
    const ds=es.flatMap(e=>e.notes.map(n=>n.di));
    const mx=Math.max(C.top,...ds), mn=Math.min(C.bot,...ds);
    const maxCh=Math.max(1,...es.map(e=>e.notes.length));
    const LR=o.labels?s*(1.45*maxCh+(o.labels==='jp'?1.1:.6)):0;
    return {...st,C,above:(mx-C.top)*s/2+s*(o.tight?1.6:3),below:(C.bot-mn)*s/2+s*(o.tight?1.6:3),LR};
  });
  const out=[]; const evPos=[]; const sysBox=[];
  let Y=s*.8;
  systems.forEach((sy,si)=>{
    let fac=(W-8-sy.hw)/sy.nat;
    if(si===systems.length-1&&systems.length>1) fac=Math.min(fac,1.3);
    if(systems.length===1&&o.noStretch) fac=Math.min(fac,1.2);
    const x0=4, xEnd=x0+sy.hw+sy.nat*fac;
    const rows=[]; let y=Y;
    stInfo.forEach(st=>{const r={st};
      if(st.hand==='R'&&FR){r.fy=y+FR*.8;y+=FR;}
      y+=st.above; r.top=y; y+=4*s; r.bot=y; y+=st.below;
      if(st.LR){r.ly=y+s*1.15;y+=st.LR;}
      if(st.hand==='L'&&FR){r.fy=y+s*1.2;y+=FR;}
      rows.push(r);});
    sysBox.push({top:Y,bottom:y});
    const yA=rows[0].top, yB=rows[rows.length-1].bot;
    rows.forEach(r=>{for(let i=0;i<5;i++){const ly=f1(r.top+i*s);out.push(`<line class="sl" x1="${x0}" x2="${f1(xEnd)}" y1="${ly}" y2="${ly}"/>`);}});
    out.push(`<line class="bl" x1="${x0}" x2="${x0}" y1="${f1(yA)}" y2="${f1(yB)}"/>`);
    if(rows.length>1) out.push(`<rect class="bk" x="${x0-3.5}" y="${f1(yA)}" width="2.2" height="${f1(yB-yA)}"/>`);
    rows.forEach(r=>{
      const C=r.st.C;
      out.push(r.st.clef==='treble'?trebleClef(x0+s*.75,r.top,s):bassClef(x0+s*.6,r.top,s));
      for(let i=0;i<nks;i++){const d=KS_POS[ksT][r.st.clef][i]; const yy=r.bot-(d-C.bot)*s/2;
        out.push(accGlyph(ksT,x0+clefW+i*s*1.0+s*.4,yy,s,'ks'));}
      if(si===0&&P.showTime){const tx=x0+hw0+s*1.1;
        out.push(`<text class="ts" x="${f1(tx)}" y="${f1(r.top+s*1.85)}" font-size="${f1(s*2.25)}" text-anchor="middle">${P.time[0]}</text><text class="ts" x="${f1(tx)}" y="${f1(r.top+s*3.85)}" font-size="${f1(s*2.25)}" text-anchor="middle">${P.time[1]}</text>`);}
    });
    let mx=x0+sy.hw;
    sy.ms.forEach((mi,k)=>{
      const MI=mInfo[mi], mw=MI.w*fac;
      if(k===0&&o.barNums!==false&&!P.free){const no=P.pickup?mi:mi+1; if(no>1) out.push(`<text class="mn" x="${f1(x0+2)}" y="${f1(yA-s*.9)}" font-size="${f1(s*1.15)}">${no}</text>`);}
      P.evs.forEach(e=>{ if(e.m!==mi) return; const row=rows.find(r=>r.st.hand===e.hand); if(!row) return;
        const x=mx+MI.pos.get(tkey(e.t))*fac; evPos[e.i]={x,sys:si};
        out.push(drawEvent(e,x,row,s,o,P)); });
      const bx=mx+mw;
      if(mi===P.measures.length-1&&!o.noFinal){out.push(`<line class="bl" x1="${f1(bx-s*.75)}" x2="${f1(bx-s*.75)}" y1="${f1(yA)}" y2="${f1(yB)}"/><rect class="bk" x="${f1(bx-s*.42)}" y="${f1(yA)}" width="${f1(s*.42)}" height="${f1(yB-yA)}"/>`);}
      else out.push(`<line class="bl" x1="${f1(bx)}" x2="${f1(bx)}" y1="${f1(yA)}" y2="${f1(yB)}"/>`);
      mx+=mw;
    });
    Y=y+s*(o.sysGap||1.6);
  });
  const H=f1(Y-s*(o.sysGap||1.6)+s*.6);
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria||'乐谱')}"><rect class="ph" x="-50" y="0" width="${f1(s*2.8)}" height="0" rx="5"/>${out.join('')}</svg>`;
  return {evPos,sysBox,s,svg:host.firstElementChild};
}
function drawEvent(e,x,row,s,o,P){
  const C=row.st.C, g=[], hw=s*.62;
  const yOf=di=>row.bot-(di-C.bot)*s/2;
  const cls=`ev h${e.hand}`;
  if(o.interactive!==false) g.push(`<rect class="hit" x="${f1(x-s*1.3)}" y="${f1(row.top-s*2.5)}" width="${f1(s*2.6)}" height="${f1(s*9)}"/>`);
  if(e.rest){ g.push(drawRest(e,x,row,s,P)); return `<g class="${cls} rest" data-i="${e.i}">${g.join('')}</g>`; }
  const ds=e.notes.map(n=>n.di), lo=Math.min(...ds), hi=Math.max(...ds);
  const led=new Set();
  ds.forEach(d=>{ for(let L=C.bot-2;L>=d;L-=2) led.add(L); for(let L=C.top+2;L<=d;L+=2) led.add(L); });
  led.forEach(L=>{const ly=f1(yOf(L)); g.push(`<line class="led" x1="${f1(x-hw-s*.42)}" x2="${f1(x+hw+s*.42)}" y1="${ly}" y2="${ly}"/>`);});
  const hollow=e.d>=2-1e-6, up=(lo+hi)/2<C.mid;
  e.notes.forEach(n=>{const y=yOf(n.di);
    g.push(`<ellipse class="hd${hollow?' ho':''}" cx="${f1(x)}" cy="${f1(y)}" rx="${f1(hw)}" ry="${f1(s*.45)}" transform="rotate(-20 ${f1(x)} ${f1(y)})"/>`);
    if(n.show) g.push(accGlyph(n.show,x-hw-s*.85,y,s,'acc'));
    if(isDotted(e.d)){const onLine=(n.di-C.bot)%2===0; g.push(`<circle class="dot" cx="${f1(x+hw+s*.55)}" cy="${f1(y-(onLine?s*.5:0))}" r="${f1(s*.18)}"/>`);}
  });
  if(e.d<4-1e-6){
    const yl=yOf(lo), yh=yOf(hi); const sx=up?x+hw*.93:x-hw*.93; const y1=up?yl:yh; const y2=up?yh-s*3.4:yl+s*3.4;
    g.push(`<line class="stem" x1="${f1(sx)}" x2="${f1(sx)}" y1="${f1(y1)}" y2="${f1(y2)}"/>`);
    const nf=flagsOf(e.d);
    for(let k=0;k<nf;k++){const fy=y2+(up?1:-1)*k*s*.9; const dir=up?1:-1;
      g.push(`<path class="flag" d="M${f1(sx)} ${f1(fy)} q${f1(s*.15)} ${f1(dir*s*1.1)} ${f1(s*1.1)} ${f1(dir*s*1.5)} q${f1(s*.55)} ${f1(dir*s*.5)} ${f1(s*.1)} ${f1(dir*s*1.6)}"/>`);}
  }
  if(row.ly&&o.labels){
    [...e.notes].sort((a,b)=>b.midi-a.midi).forEach((n,k)=>{
      const L=labelOf(n,o.labels,P.doPc||0), ly=row.ly+k*s*1.45;
      g.push(`<text class="lab" x="${f1(x)}" y="${f1(ly)}" font-size="${f1(s*1.28)}" text-anchor="middle">${L.t}</text>`);
      for(let d=0;d<Math.abs(L.dots);d++){const dy=L.dots>0?ly-s*1.2-d*s*.42:ly+s*.45+d*s*.42; g.push(`<circle class="labdot" cx="${f1(x)}" cy="${f1(dy)}" r="${f1(s*.15)}"/>`);}
    });
  }
  if(row.fy&&o.fingers){const fs=[...e.notes].sort((a,b)=>b.midi-a.midi).map(n=>n.f).filter(Boolean);
    if(fs.length){ if(e.shift) g.push(`<circle class="shiftmk" cx="${f1(x)}" cy="${f1(row.fy-s*.42)}" r="${f1(s*.85)}"/>`);
      g.push(`<text class="fing${e.shift?' sh':''}" x="${f1(x)}" y="${f1(row.fy)}" font-size="${f1(s*1.15)}" text-anchor="middle">${fs.join('')}</text>`); } }
  return `<g class="${cls}" data-i="${e.i}">${g.join('')}</g>`;
}
// 谱号与升降号用路径画，不依赖字体
function trebleClef(x,top,s){
  return `<g class="clefg" transform="translate(${f1(x)} ${f1(top)}) scale(${s})"><path d="M1.55 3.15C.95 3.2.95 2.35 1.5 2.25C2.35 2.15 2.55 3.6 1.6 3.9C.45 4.2-.1 2.65.9 1.65C1.6.95 2.2.15 2-.85C1.9-1.75 1.2-1.7 1.15-.6L1.75 5.25C1.85 6.15.9 6.4.75 5.8" fill="none" stroke-width=".22" stroke-linecap="round"/><circle cx=".98" cy="5.62" r=".36"/></g>`;
}
function bassClef(x,top,s){
  return `<g class="clefg" transform="translate(${f1(x)} ${f1(top)}) scale(${s})"><path d="M.45 1.05C.45 0 2.25-.3 2.45 1C2.65 2.6 1.35 3.65.2 4.35" fill="none" stroke-width=".25" stroke-linecap="round"/><circle cx=".62" cy="1.1" r=".42"/><circle cx="3.05" cy=".5" r=".19"/><circle cx="3.05" cy="1.5" r=".19"/></g>`;
}
function accGlyph(t,x,y,s,cls){
  const P=(a,b)=>`${f1(x+a*s)} ${f1(y+b*s)}`;
  if(t==='#') return `<g class="${cls}"><path d="M${P(-.24,-1.25)}L${P(-.24,1.35)}M${P(.24,-1.35)}L${P(.24,1.25)}" stroke-width="${f1(s*.11)}"/><path d="M${P(-.58,-.3)}L${P(.58,-.55)}M${P(-.58,.55)}L${P(.58,.3)}" stroke-width="${f1(s*.3)}"/></g>`;
  if(t==='b') return `<g class="${cls}"><path d="M${P(-.3,-1.7)}L${P(-.3,.55)}C${P(.65,-.05)} ${P(.55,-.85)} ${P(-.3,-.25)}" fill="none" stroke-width="${f1(s*.16)}"/></g>`;
  return `<g class="${cls}"><path d="M${P(-.3,-1.3)}L${P(-.3,.55)}M${P(.3,-.55)}L${P(.3,1.3)}" stroke-width="${f1(s*.11)}"/><path d="M${P(-.3,-.2)}L${P(.3,-.42)}M${P(-.3,.5)}L${P(.3,.28)}" stroke-width="${f1(s*.28)}"/></g>`;
}
function drawRest(e,x,row,s,P){
  const d=e.d, mid=row.top+2*s, dotted=isDotted(d), base=dotted?d/1.5:d; let r='';
  const full=Math.abs(d-(P.measures[e.m]?.len||0))<1e-6&&d>=1;
  if(base>=4-1e-6||full) r=`<rect class="rst" x="${f1(x-s*.6)}" y="${f1(row.top+s)}" width="${f1(s*1.2)}" height="${f1(s*.5)}"/>`;
  else if(base>=2-1e-6) r=`<rect class="rst" x="${f1(x-s*.6)}" y="${f1(mid-s*.5)}" width="${f1(s*1.2)}" height="${f1(s*.5)}"/>`;
  else if(base>=1-1e-6) r=`<path class="rsts" d="M${f1(x-s*.35)} ${f1(mid-s*1.5)} l${f1(s*.75)} ${f1(s*.9)} l${f1(-s*.6)} ${f1(s*.75)} l${f1(s*.7)} ${f1(s*.85)} q${f1(-s*.95)} ${f1(-s*.35)} ${f1(-s*.55)} ${f1(s*.95)}"/>`;
  else{const n=base>=.5-1e-6?1:2;
    for(let k=0;k<n;k++){const oy=k*s*.95, ox=-k*s*.25;
      r+=`<circle class="rst" cx="${f1(x-s*.45+ox)}" cy="${f1(mid-s*.5+oy)}" r="${f1(s*.27)}"/><path class="rsts" d="M${f1(x-s*.45+ox)} ${f1(mid-s*.35+oy)} q${f1(s*.6)} ${f1(s*.25)} ${f1(s*.95)} ${f1(-s*.4)} L${f1(x-s*.05+ox-k*s*.2)} ${f1(mid+s*1.1+oy*.4)}"/>`;}
  }
  if(dotted&&!full) r+=`<circle class="rst" cx="${f1(x+s*.9)}" cy="${f1(mid-s*.5)}" r="${f1(s*.18)}"/>`;
  return r;
}

/* ================= 声音 ================= */
const AU={ctx:null,master:null};
function audio(){
  if(!AU.ctx){
    const C=window.AudioContext||window.webkitAudioContext; AU.ctx=new C();
    const comp=AU.ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4;
    AU.master=AU.ctx.createGain(); AU.master.gain.value=.75; AU.master.connect(comp); comp.connect(AU.ctx.destination);
  }
  if(AU.ctx.state==='suspended') AU.ctx.resume();
  return AU.ctx;
}
const outLat=()=>AU.ctx?(AU.ctx.outputLatency||AU.ctx.baseLatency||0):0;
function makeVoice(midi,t0,vel=.7){
  const ctx=audio(); t0=Math.max(t0,ctx.currentTime+.004);
  const f=440*Math.pow(2,(midi-69)/12);
  const out=ctx.createGain(); out.gain.value=0;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=.5;
  lp.frequency.setValueAtTime(Math.min(12000,f*8+700),t0); lp.frequency.setTargetAtTime(Math.min(7000,f*2.4+350),t0,.3);
  lp.connect(out); out.connect(AU.master);
  const parts=[['triangle',1,1],['triangle',1.0027,.45],['sine',2,.34],['sine',3,midi<80?.1:.03],['sine',.5,midi<48?.0:.0]];
  const oscs=parts.filter(p=>p[2]>0).map(([type,mul,gv])=>{const o=ctx.createOscillator(); o.type=type; o.frequency.value=f*mul; const gg=ctx.createGain(); gg.gain.value=gv; o.connect(gg); gg.connect(lp); o.start(t0); return o;});
  const peak=.24*vel*(midi<52?1.3:1)*(midi>84?.8:1);
  const G=out.gain; G.setValueAtTime(0,t0); G.linearRampToValueAtTime(peak,t0+.005);
  G.setTargetAtTime(peak*.38,t0+.005,.1);
  G.setTargetAtTime(0,t0+.25,.6+2.2*Math.max(0,96-midi)/75);
  let stopped=false;
  return {stopAt(t){ if(stopped) return; stopped=true; t=Math.max(t,t0+.04); G.setTargetAtTime(0,t,.07); oscs.forEach(o=>{try{o.stop(t+.6);}catch(_){} }); }};
}
function tone(m,when,dur,vel){ makeVoice(m,when,vel).stopAt(when+dur); }
function playChord(ms,dur=1.2,vel=.6){ const ctx=audio(); const t=ctx.currentTime+.03; ms.forEach(m=>tone(m,t,dur,vel)); }
function click(when,strong){
  const ctx=audio(); const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine'; o.frequency.value=strong?1900:1250; o.connect(g); g.connect(AU.master);
  g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(strong?.32:.2,when+.002); g.gain.exponentialRampToValueAtTime(.001,when+.05);
  o.start(when); o.stop(when+.07);
}
// 播放一段音符序列（课程、示范用）
let SEQ_STOP=null;
function playSeq(seq,bpm=90,opt={}){
  stopSeq();
  const X=parseSeq(seq,'R'); const ctx=audio(); const spb=60/bpm; const t0=ctx.currentTime+.08+(opt.countIn?opt.countIn*spb:0);
  if(opt.countIn) for(let k=0;k<opt.countIn;k++) click(t0-(opt.countIn-k)*spb,k===0);
  const voices=[];
  X.evs.forEach(e=>{ if(e.rest) return; e.notes.forEach(n=>{const v=makeVoice(n.midi,t0+e.t*spb,.7); v.stopAt(t0+(e.t+e.d)*spb*.98); voices.push(v);}); });
  if(opt.metro) for(let b=0;b<X.end-1e-6;b+=1) click(t0+b*spb,b%(opt.metro)===0);
  const timer=setTimeout(()=>{SEQ_STOP=null; opt.onEnd&&opt.onEnd();},(t0-ctx.currentTime+X.end*spb)*1000+120);
  SEQ_STOP=()=>{clearTimeout(timer);};
  return {t0,spb,X};
}
function stopSeq(){ if(SEQ_STOP){SEQ_STOP();SEQ_STOP=null;} }

/* ================= 听琴：从麦克风或录音里识别钢琴音 =================
   每 30ms 取一帧频谱，对每个琴键把它的前 6 个泛音能量加起来（谐波求和），
   得到“这个键在响”的可能性；再用音量突增判断“刚按下一个键”。
   因为知道谱子上该弹什么，只需判断“该弹的音在不在、有没有明显弹错”，比盲识别可靠得多。 */
const PT_LO=28, PT_HI=100;
function makeTracker(sr,N){
  const binHz=sr/N, W=[1,.8,.62,.5,.4,.33], ranges=[];
  for(let m=PT_LO;m<=PT_HI;m++){ const f=440*Math.pow(2,(m-69)/12), r=[];
    for(let h=1;h<=W.length;h++){ const fh=f*h; if(fh>Math.min(sr*.45,5000)) break; const b=fh/binHz; r.push([Math.max(1,Math.floor(b*.988)),Math.ceil(b*(h>=5?1.03:1.02)),W[h-1],h]); }
    ranges[m]=r; }
  const st={prevRms:0,amb:.002,hist:[],lastOn:-1,mag:new Float32Array(N/2)};
  return function(db,td,t){
    let s=0; const L=td.length, n=Math.min(1024,L); for(let i=L-n;i<L;i++) s+=td[i]*td[i];
    const rms=Math.sqrt(s/n);
    if(rms<st.amb) st.amb=Math.max(rms,1e-4); else st.amb*=1.01;
    const mag=st.mag; for(let i=0;i<db.length;i++) mag[i]=db[i]<-140?0:Math.pow(10,db[i]/20);
    // sal：谐波总和；odd：奇次谐波（1、3、5），用来分辨“真的是低八度”还是只是泛音
    const sal=new Float32Array(128), odd=new Float32Array(128); let mx=0;
    for(let m=PT_LO;m<=PT_HI;m++){ let v=0,o=0; for(const [a,b,w,h] of ranges[m]){ let pk=0; for(let k=a;k<=b;k++) if(mag[k]>pk) pk=mag[k]; v+=w*pk; if(h%2) o+=w*pk; } sal[m]=v; odd[m]=o; if(v>mx) mx=v; }
    const loud=rms>Math.max(.004,st.amb*2.5);
    let onset=false;
    if(loud&&rms>st.prevRms*1.3&&t-st.lastOn>.08) onset=true;
    // 频谱窗口较长，新音是慢慢“长”出来的，所以和约 0.12 秒前比
    const old=st.hist.length>=4?st.hist[st.hist.length-4]:null;
    if(!onset&&loud&&old&&t-st.lastOn>.2){ let rise=0; for(let m=PT_LO;m<=PT_HI;m++){ const d=sal[m]-old[m]*1.5; if(d>rise) rise=d; } if(rise>mx*.35) onset=true; }
    if(onset) st.lastOn=t;
    st.prevRms=rms; st.hist.push(sal); if(st.hist.length>6) st.hist.shift();
    return {t,rms,loud,onset,sal,odd,mx,med:medianSal(sal),top:loud?peakNotes(sal,mx,odd):[]};
  };
}
// 从谐波和里挑出最像“真正被弹响”的几个键（去掉泛音造成的假象）
function peakNotes(sal,mx,odd){
  const c=Float32Array.from(sal), out=[];
  // 没有自己奇次谐波的低八度“音”只是泛音的影子，先压下去
  if(odd) for(let m=PT_LO;m+12<=PT_HI;m++) if(odd[m]<odd[m+12]*.4) c[m]*=.3;
  for(let it=0;it<4;it++){ let m=-1,v=0; for(let i=PT_LO;i<=PT_HI;i++) if(c[i]>v){v=c[i];m=i;}
    if(m<0||v<mx*.35) break; out.push(m); c[m]=0; c[m-1]=0; c[m+1]=0;
    for(const d of [12,19,24,28,31]) if(m+d<128) c[m+d]=Math.max(0,c[m+d]-sal[m]*.7);
    if(m>=12) c[m-12]*=.4; }
  return out;
}
// 该弹的音 r 在这一帧里是否响着（req：同一拍一起该弹的音，用来放过八度和弦）
function medianSal(sal){ const a=Array.from(sal.subarray(PT_LO,PT_HI+1)).sort((x,y)=>x-y); return a[a.length>>1]; }
function notePresent(fr,r,req){
  if(!fr.loud) return false; const s=fr.sal;
  if(s[r]<Math.max(fr.mx*.12,(fr.med||0)*2.5)||s[r]<s[r-1]||s[r]<s[r+1]) return false;
  if(fr.odd&&!(req&&req.has(r-12))&&fr.odd[r-12]>fr.odd[r]*.6&&s[r-12]>s[r]) return false; // 其实弹的是低八度
  return true;
}

function micAttach(node){

// 录音文件：离线逐帧分析，返回所有帧
async function analyzeRecording(file,onProgress){
  const buf=await audio().decodeAudioData(await file.arrayBuffer());
  const sr=buf.sampleRate, dur=Math.min(buf.duration,600);
  const off=new OfflineAudioContext(1,Math.ceil(dur*sr),sr);
  const src=off.createBufferSource(); src.buffer=buf;
  const an=off.createAnalyser(); an.fftSize=8192; an.smoothingTimeConstant=0;
  src.connect(an); an.connect(off.destination);
  const proc=makeTracker(sr,8192), db=new Float32Array(4096), td=new Float32Array(8192), frames=[];
  for(let t=.03;t<dur-.01;t+=.03){ const tt=t;
    off.suspend(tt).then(()=>{ an.getFloatFrequencyData(db); an.getFloatTimeDomainData(td); frames.push(proc(db,td,tt)); if(onProgress&&frames.length%60===0) onProgress(tt/dur); off.resume(); }); }
  src.start(0); await off.startRendering();
  return frames;
}
// 把帧整理成“一次次按键”：每个起音后 0.05–0.3 秒内各键的最大响度
function onsetsFromFrames(frames){
  const ons=[];
  // 频谱窗口约 0.17 秒，会“滞后”，所以取起音后 0.1 秒起的几帧
  frames.forEach((fr,i)=>{ if(!fr.onset) return;
    let next=Infinity; for(let j=i+1;j<frames.length;j++) if(frames[j].onset){next=frames[j].t;break;}
    const a=fr.t+Math.min(.17,Math.max(.08,(next-fr.t)*.9)), b=Math.max(a,Math.min(fr.t+.4,next+.04));
    const sal=new Float32Array(128), odd=new Float32Array(128); let mx=0;
    for(let j=i;j<frames.length;j++){ const g=frames[j]; if(g.t>b+1e-6) break; if(g.t<a-1e-6) continue;
      for(let m=PT_LO;m<=PT_HI;m++){ if(g.sal[m]>sal[m]) sal[m]=g.sal[m]; if(g.odd[m]>odd[m]) odd[m]=g.odd[m]; } }
    for(let m=PT_LO;m<=PT_HI;m++) if(sal[m]>mx) mx=sal[m];
    ons.push({t:fr.t,sal,odd,mx,med:medianSal(sal),loud:true,top:peakNotes(sal,mx,odd)}); });
  return ons;
}
// 动态规划对齐：谱上的每一拍 ↔ 录音里的每次按键
function alignTake(groups,ons){
  const n=groups.length,k=ons.length, D=[], B=[];
  const ok=(i,j)=>[...groups[i].req].every(r=>notePresent(ons[j],r,groups[i].sound));
  for(let i=0;i<=n;i++){D.push(new Float32Array(k+1));B.push(new Uint8Array(k+1));}
  for(let i=1;i<=n;i++){D[i][0]=i;B[i][0]=1;} for(let j=1;j<=k;j++){D[0][j]=j*.7;B[0][j]=2;}
  for(let i=1;i<=n;i++) for(let j=1;j<=k;j++){
    const m=D[i-1][j-1]+(ok(i-1,j-1)?0:1), del=D[i][j-1]+.7, miss=D[i-1][j]+1;
    if(m<=del&&m<=miss){D[i][j]=m;B[i][j]=0;} else if(miss<=del){D[i][j]=miss;B[i][j]=1;} else {D[i][j]=del;B[i][j]=2;} }
  const res=new Array(n); let i=n,j=k;
  while(i>0||j>0){ const b=B[i][j];
    if(i>0&&j>0&&b===0){ res[i-1]={st:ok(i-1,j-1)?'ok':'wrong',on:ons[j-1]}; i--; j--; }
    else if(i>0&&(b===1||j===0)){ res[i-1]={st:'miss'}; i--; }
    else j--; }
  return res;
}

function makeKeyboard(lo,hi,opt={}){
  while(isBlack(lo)) lo--; while(isBlack(hi)) hi++;
  const whites=[]; for(let m=lo;m<=hi;m++) if(!isBlack(m)) whites.push(m);
  const N=whites.length;
  const root=el(`<div class="kb${opt.small?' small':''}"></div>`);
  root.style.minWidth=(N*(opt.minKey||26))+'px';
  const keys=new Map();
  whites.forEach(m=>{const k=el(`<div class="key w" data-m="${m}"><span class="fg"></span><span class="lab"></span></div>`); root.appendChild(k); keys.set(m,k);});
  for(let m=lo;m<=hi;m++) if(isBlack(m)){const wi=whites.indexOf(m-1);
    const k=el(`<div class="key b" data-m="${m}" style="left:${((wi+1)-.31)/N*100}%;width:${.62/N*100}%"><span class="fg"></span><span class="lab"></span></div>`); root.appendChild(k); keys.set(m,k);}
  const kb={root,keys,lo,hi,N,onNote:opt.onNote||null,sound:opt.sound!==false,voices:new Map(),state:new Map()};
  const ptr=new Map();
  const keyAt=(x,y)=>{const t=document.elementFromPoint(x,y); const k=t&&t.closest&&t.closest('.key'); return k&&root.contains(k)?+k.dataset.m:null;};
  root.addEventListener('pointerdown',e=>{const k=e.target.closest('.key'); if(!k) return; e.preventDefault(); const m=+k.dataset.m; ptr.set(e.pointerId,m); kbDown(kb,m,'screen'); try{root.setPointerCapture(e.pointerId);}catch(_){} });
  root.addEventListener('pointermove',e=>{ if(!ptr.has(e.pointerId)) return; const m=keyAt(e.clientX,e.clientY); const old=ptr.get(e.pointerId); if(m!=null&&m!==old){kbUp(kb,old); ptr.set(e.pointerId,m); kbDown(kb,m,'screen');} });
  const end=e=>{ if(!ptr.has(e.pointerId)) return; kbUp(kb,ptr.get(e.pointerId)); ptr.delete(e.pointerId); };
  root.addEventListener('pointerup',end); root.addEventListener('pointercancel',end); root.addEventListener('lostpointercapture',end);
  return kb;
}

function kbBaseLabels(kb,fn){ kb.keys.forEach((k,m)=>{k.dataset.base=fn(m)||''; k.querySelector('.lab').textContent=k.dataset.base;}); kb.state.clear(); }
function kbFlash(kb,m,cls,ms=350){ const k=kb.keys.get(m); if(!k) return; k.classList.add(cls); setTimeout(()=>k.classList.remove(cls),ms); }
function kbCenter(kb,ms){
  const wrap=kb.root.parentElement; if(!wrap||wrap.scrollWidth<=wrap.clientWidth+2||!ms.length) return;
  const xs=ms.map(m=>{const k=kb.keys.get(m); return k?k.offsetLeft+k.offsetWidth/2:null;}).filter(v=>v!=null);
  if(!xs.length) return; const c=(Math.min(...xs)+Math.max(...xs))/2;
  const target=c-wrap.clientWidth/2; if(Math.abs(wrap.scrollLeft-target)>wrap.clientWidth*.3) wrap.scrollTo({left:target,behavior:'smooth'});
}

/* 外部输入：电脑键盘 + MIDI 电钢琴 → 当前页面的键盘 */
const INPUT={kb:null,base:60};
let SETTINGS_MIDI_SILENT=true;
const KEYMAP='awsedftgyhujkolp;\'';
window.addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
  if(HOTKEY&&HOTKEY(e)) return;
  if(!INPUT.kb) return;
  const key=e.key.toLowerCase();
  if(key==='z'||key==='x'){INPUT.base+=key==='z'?-12:12; INPUT.base=Math.max(24,Math.min(96,INPUT.base)); toast('电脑键盘 A 键 = '+midiName(INPUT.base)); updKbHint(); e.preventDefault(); return;}
  const i=KEYMAP.indexOf(key); if(i<0) return;
  e.preventDefault(); const m=INPUT.base+i; if(m<INPUT.kb.lo||m>INPUT.kb.hi) return;
  HELD.set(e.code,m); kbDown(INPUT.kb,m,'key');
});
window.addEventListener('keyup',e=>{ if(HELD.has(e.code)&&INPUT.kb){kbUp(INPUT.kb,HELD.get(e.code));HELD.delete(e.code);} });
const HELD=new Map(); let HOTKEY=null;
function updKbHint(){ const h=$('#kbhint'); if(h) h.textContent=`电脑键盘：A W S E D F … 对应 ${midiName(INPUT.base)} 起，Z / X 换八度`; }
const MIDI={n:0};
async function connectMIDI(){
  if(!navigator.requestMIDIAccess){toast('当前浏览器不支持 MIDI，可用电脑上的 Chrome 或 Edge');return;}
  try{
    const acc=await navigator.requestMIDIAccess();
    const hook=()=>{let n=0; acc.inputs.forEach(inp=>{inp.onmidimessage=onMidi;n++;}); MIDI.n=n;};
    hook(); acc.onstatechange=hook;
    toast(MIDI.n?`已连接 ${MIDI.n} 个 MIDI 设备，弹电钢琴就能被识别`:'没找到 MIDI 设备：请用 USB 线连接电钢琴后再试');
  }catch(_){ toast('这个打开方式不允许连接 MIDI；可以继续用屏幕键盘，或在等待模式里点“下一步”'); }
}
function onMidi(ev){
  const [st,note,vel]=ev.data; const cmd=st&0xf0; if(!INPUT.kb) return;
  if(cmd===0x90&&vel>0){ if(note>=INPUT.kb.lo&&note<=INPUT.kb.hi) kbDown(INPUT.kb,note,'midi'); else if(INPUT.kb.onNote) INPUT.kb.onNote(note,true,'midi'); }
  else if(cmd===0x80||(cmd===0x90&&vel===0)) kbUp(INPUT.kb,note);
}

/* ================= 弹窗 / 提示 ================= */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,2600); }
function modal(html,bind){ const m=$('#modal'); m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; bind&&bind(m); }
function closeModal(){ const m=$('#modal'); m.hidden=true; m.innerHTML=''; }
const RATE_TXT={1:'能磕磕绊绊弹完一遍',2:'慢速下能流畅弹下来',3:'原速流畅，几乎不用看键盘'};
function starStr(n,max=3){ return `<span class="stars" aria-label="${n} 颗星">${'★'.repeat(n)}<span class="off">${'★'.repeat(max-n)}</span></span>`; }
function rateSong(id,{title,text,suggest}={}){
  const s=SONG[id]; const old=PG.stars[id]||0;
  modal(`<h3>${title||'给《'+esc(s.title)+'》打个分'}</h3><p class="muted">${text||'按你现在真实的水平选，之后随时可以再提高。'}</p>
   <div class="rate">${[1,2,3].map(n=>`<button data-n="${n}" class="${suggest===n?'sug':''}"><span class="s">${'★'.repeat(n)}</span><span>${RATE_TXT[n]}${suggest===n?' <span class="pill">系统建议</span>':''}</span></button>`).join('')}</div>
   <div class="mrow"><button class="btn" data-x>先不打分</button></div>`,m=>{
    $$('.rate button',m).forEach(b=>b.onclick=()=>{const n=+b.dataset.n;
      const before=xpInfo().lv;
      PG.stars[id]=Math.max(old,n); logToday('p'); save(); closeModal();
      const after=xpInfo();
      if(after.lv>before) toast(`升级了！Lv.${after.lv} ${after.title}`); else if(n>old) toast(`获得 ${n-old} 颗新星，+${(n-old)*40} 经验`); else toast('已记录，继续加油');
      const sb=$('#plstars'); if(sb) sb.innerHTML=starStr(PG.stars[id]||0);
    });
    $('[data-x]',m).onclick=closeModal;
  });
}

 {id:'p1',ch:'p',title:'每天 15 分钟怎么练',min:3,blocks:[

  {p:'<b>2 分钟</b> 热身：五指位置来回爬音，左右手各一遍。<br><b>8 分钟</b> 当前曲目：慢速、分手、分段。<br><b>3 分钟</b> 复习一首已经会的曲子（找成就感）。<br><b>2 分钟</b> 训练场随便玩一个。'},

 {id:'p2',ch:'p',title:'新曲子三步走',min:4,blocks:[
  {p:'<b>第一步 · 分手</b>：右手单独、左手单独，各用“等待模式”把音找对，不管节奏。'},

 {id:'p4',ch:'p',title:'指法怎么看、怎么选',min:5,blocks:[
  {p:'<b>指法就是“哪根手指弹哪个键”</b>。同一段旋律，指法对了手很顺，指法乱了就会卡住、越练越别扭。所以宁可慢，也要每次用同样的指法。'},
  {p:'<b>在本站哪里看指法：</b>乐谱上方（左手在下方）的小数字；键盘上亮起的键里的<b>实心圆数字</b>；旁边几个<b>虚线圈数字</b>是其他手指该放的位置——照着放，手就“就位”了。'},
  {p:'谱上数字外面有<b>红色圆圈</b>的地方，表示这里手要<b>换位置</b>：提前看一眼下一个音，让对应的手指过去。'},
  {p:'<b>五条最常用的规则</b><br>① 五指位置：五根手指各管一个相邻的白键，手不动，一指一键。<br>② 拇指穿越：往上走、手指不够用时，拇指从手心下面穿过去（音阶里 3 指弹完 E，拇指穿过去弹 F）。<br>③ 跨指：往下走时，3 指或 2 指从拇指上面跨过来。<br>④ 换手位：遇到大跳或乐句开头，干脆把整只手抬起来移到新位置。<br>⑤ 拇指尽量不弹黑键，小指也少弹黑键。'},
  {staff:{seq:'C4@1 D4@2 E4@3 F4@1 G4@2 A4@3 B4@4 C5@5',clef:'treble',labels:true,fingers:true,play:84}},
  {tip:'本站的指法有据可依：入门曲用教材通行的“五指位置”指法；其余的音按 Parncutt 等人 1997 年发表在《Music Perception》上的键盘指法模型自动计算——它把巴赫、图尔克、车尔尼以来的指法原则归纳成 12 条难度规则（手指跨度、换手位、穿指、弱指、拇指别上黑键等），选总难度最低的一种；乐谱上原有的指法一律保留，重复的乐句用同一套指法。实在觉得别扭，也可以按自己顺手的来——关键是<b>每次都一样</b>。'}],
  quiz:[{q:'右手弹 C 大调音阶往上走，E 用 3 指之后，F 用几指？',opts:['4 指','拇指（1 指）穿过去','5 指','2 指'],a:1},{q:'谱上指法数字带红圈表示？',opts:['弹得重一点','这里要换手的位置','可以跳过','用左手弹'],a:1}]},

const LESSON=Object.fromEntries(LESSONS.map(l=>[l.id,l]));

/* ================= 我的曲库：用简谱录入曲子 =================
   录入的曲子只存在你自己的进度里（本机/你的 Claude 账号），不会公开。 */
const KEYS={C:{pc:0,ks:0},G:{pc:7,ks:1},D:{pc:2,ks:2},A:{pc:9,ks:3},E:{pc:4,ks:4},F:{pc:5,ks:-1},Bb:{pc:10,ks:-2},Eb:{pc:3,ks:-3},Ab:{pc:8,ks:-4}};
const MAJ=[0,2,4,5,7,9,11];
const keyName=k=>k.replace('b','♭');
const customIds=()=>Object.keys(PG.custom||{}).filter(id=>PG.custom[id]&&!PG.custom[id].deleted).sort((a,b)=>(PG.custom[a].created||0)-(PG.custom[b].created||0));
function syncCustom(){
  Object.keys(SONG).forEach(id=>{ if(SONG[id].custom&&!(PG.custom[id]&&!PG.custom[id].deleted)) delete SONG[id]; });
  customIds().forEach(id=>{ const c=PG.custom[id]; if(SONG[id]&&SONG[id].at===c.at) return;
    SONG[id]={id,custom:true,at:c.at,title:c.title,sub:c.sub||'我的曲子',key:c.keyLabel||('1='+keyName(c.key)),doPc:KEYS[c.key].pc,keySig:KEYS[c.key].ks,time:c.time,pickup:c.pickup||0,bpm:c.bpm,lv:0,
      tip:'这首是你自己录入的。指法是自动配的，觉得别扭就按顺手的来，但每次都用同一种。',rh:c.rh,lh:c.lh||null}; });
}
// 用调里的音级给音命名（F 调的 4 是 B♭ 不是 A♯）
function nameFromDegree(deg,acc,oct,key){
  const L0=key[0], li0=LET.indexOf(L0), tonic=60+KEYS[key].pc;
  const li=(li0+deg-1)%7, midi=tonic+MAJ[deg-1]+acc+12*oct;
  let no=Math.round((midi-LSEMI[li]-12)/12); const diff=midi-((no+1)*12+LSEMI[li]);
  if(diff===0) return LET[li]+no; if(diff===1) return LET[li]+'#'+no; if(diff===-1) return LET[li]+'b'+no;
  return midiName(midi);
}
function parseJianpu(text,key,octShift){
  const s=text.replace(/｜/g,'|').replace(/[－—]/g,'-').replace(/，/g,',').replace(/[·•]/g,'.').replace(/[＃♯]/g,'#').replace(/♭/g,'b').replace(/[‘’`´]/g,"'").replace(/［/g,'[').replace(/］/g,']').replace(/＿/g,'_');
  const toks=[], bars=[], errs=[]; let t=0, i=0;
  const note=()=>{ let acc=0; while(s[i]==='#'||s[i]==='b'){acc+=s[i]==='#'?1:-1;i++;}
    if(!/[0-7]/.test(s[i]||'')){ errs.push(`第 ${i+1} 个字符“${s[i]||'结尾'}”：这里应该是数字 0–7`); i++; return null; }
    const deg=+s[i++]; let oct=0;
    while(s[i]==="'"||s[i]==='^'||s[i]===','){ oct+=s[i]===','?-1:1; i++; }
    return deg===0?{rest:true}:{deg,acc,oct}; };
  const durMods=()=>{ let d=1, dotted=false;
    while(s[i]==='_'||s[i]==='='||s[i]==='.'||s[i]==="'"||s[i]===','){ if(s[i]==='_') d/=2; else if(s[i]==='=') d/=4; else if(s[i]==='.'&&!dotted){dotted=true;} else if(s[i]==='.') break; i++; }
    return dotted?d*1.5:d; };
  while(i<s.length){ const c=s[i];
    if(/\s/.test(c)||c===':'){i++;continue;}
    if(c==='|'){ bars.push(t); i++; continue; }
    if(c==='-'){ if(!toks.length) errs.push('开头不能是“-”'); else { toks[toks.length-1].dur+=1; t+=1; } i++; continue; }
    if(c==='['){ i++; const ns=[]; while(i<s.length&&s[i]!==']'){ if(/\s/.test(s[i])){i++;continue;} const n=note(); if(n&&!n.rest) ns.push(n); }
      if(s[i]!==']'){ errs.push('和弦少了右边的“]”'); break; } i++;
      const dur=durMods(); if(ns.length) toks.push({notes:ns,dur}); t+=dur; continue; }
    if(/[0-7#b]/.test(c)){ const start=i; const n=note(); if(!n) continue;
      // 允许把八度记号写在时值记号后面，比如 1_'
      let d=1, dotted=false;
      while(i<s.length&&/[_=.',^]/.test(s[i])){ const x=s[i]; if(x==='_') d/=2; else if(x==='=') d/=4; else if(x==='.'){ if(dotted) break; dotted=true; } else if(!n.rest) n.oct+=x===','?-1:1; i++; }
      const dur=dotted?d*1.5:d; toks.push(n.rest?{rest:true,dur}:{notes:[n],dur}); t+=dur; continue; }
    errs.push(`看不懂“${c}”（第 ${i+1} 个字符），已跳过`); i++;
  }
  const seq=[]; let tt=0, bi=0;
  toks.forEach(k=>{ while(bi<bars.length&&bars[bi]<=tt+1e-6){ if(seq.length) seq.push('|'); bi++; }
    const d=+k.dur.toFixed(6);
    seq.push(k.rest?`r/${d}`:k.notes.map(n=>nameFromDegree(n.deg,n.acc,n.oct+octShift,key)).join('+')+'/'+d); tt+=k.dur; });
  return {seq:seq.join(' '),errs,end:t,bars,toks,count:toks.filter(k=>!k.rest).length};
}
// 小节拍数检查
function barCheck(r,time,pickup){
  const bar=time[0]*4/time[1], msgs=[]; let prev=0;
  r.bars.forEach((b,k)=>{ const len=b-prev; const want=(k===0&&pickup)?pickup:bar; const lastShort=k===r.bars.length-1&&Math.abs(b-r.end)<1e-6&&len<want;
    if(Math.abs(len-want)>1e-6&&!lastShort) msgs.push(`第 ${k+1} 小节有 ${+len.toFixed(2)} 拍（应该 ${want} 拍）`); prev=b; });
  return msgs;
}
// 自动配左手：每小节在 I、IV、V、vi、ii 里挑最贴合旋律的和弦，弹根音（或根音 + 五度）
function autoLH(rhSeq,key,time,pickup,mode){
  const bar=time[0]*4/time[1], X=parseSeq(rhSeq,'R'), tonic=KEYS[key].pc, end=X.end;
  const CH=[[1,[0,4,7],.35],[4,[5,9,0],.1],[5,[7,11,2],.15],[6,[9,0,4],0],[2,[2,5,9],-.1]];
  const out=[]; let a=0;
  const ms=[]; if(pickup>0){ms.push([0,pickup,true]); a=pickup;} while(a<end-1e-6){ ms.push([a,Math.min(bar,end-a),false]); a+=bar; }
  ms.forEach(([a,len,pick],k)=>{ const notes=X.evs.filter(e=>!e.rest&&e.t<a+len-1e-6&&e.t+e.d>a+1e-6);
    if(pick||!notes.length){ out.push(`r/${+len.toFixed(6)}`); return; }
    let best=null;
    CH.forEach(([deg,pcs,bias])=>{ let sc=bias; notes.forEach(e=>{ const w=Math.min(e.t+e.d,a+len)-Math.max(e.t,a); const strong=Math.abs(e.t-a)<1e-6?1.5:1;
      e.notes.forEach(n=>{ const rel=((n.midi-tonic)%12+12)%12; sc+=(pcs.includes(rel)?1:-.6)*w*strong; }); });
      if((k===ms.length-1)&&deg===1) sc+=1;
      if(!best||sc>best.sc) best={sc,deg}; });
    let root=48+((tonic+MAJ[best.deg-1])%12); if(root>54) root-=12;
    const nm=m=>{ for(let d=1;d<=7;d++) for(let o=-3;o<=1;o++) if(60+tonic+MAJ[d-1]+12*o===m) return nameFromDegree(d,0,o,key); return midiName(m); };
    out.push((mode==='fifth'?nm(root)+'+'+nm(root+7):nm(root))+'/'+(+len.toFixed(6)));
  });
  return out.join(' | ');
}
function openEditor(id){
  const c=id?PG.custom[id]:null, src=c?c.src:{};
  if(c&&!src){ modal(`<h3>这首不能在这里编辑</h3><p class="muted">《${esc(c.title)}》是按你给的 PDF 乐谱直接录入的，不是用简谱输入的。想改哪里，告诉 Claude 曲名和第几小节就行。</p><div class="mrow" style="margin-top:14px"><button class="btn pri" data-x>好的</button></div>`,m=>$('[data-x]',m).onclick=closeModal); return; }
  const v=(k,d)=>src&&src[k]!=null?src[k]:d;
  openStage(`${stageHead(c?'编辑：'+esc(c.title):'添加曲子','用简谱录入，自动配指法')}<div class="st-body"><div class="st-inner">
    <div class="form">
      <label style="grid-column:1/-1">曲名<input id="ed-title" maxlength="40" value="${esc(v('title',''))}" placeholder="比如：风的季节"></label>
      <label>调（简谱开头的 1=?）<select id="ed-key">${Object.keys(KEYS).map(k=>`<option value="${k}" ${v('key','C')===k?'selected':''}>1=${keyName(k)}</option>`).join('')}</select></label>
      <label>拍号<select id="ed-time">${['2/4','3/4','4/4','6/8'].map(t=>`<option ${v('time','4/4')===t?'selected':''}>${t}</option>`).join('')}</select></label>
      <label>速度（每分钟几拍）<input id="ed-bpm" type="number" min="30" max="200" value="${v('bpm',80)}"></label>
      <label>弱起（第一小节前有几拍）<input id="ed-pick" type="number" min="0" max="3" step="0.5" value="${v('pickup',0)}"></label>
    </div>
    <h2 class="section-t">右手旋律</h2>
    <textarea class="jp-area" id="ed-rh" spellcheck="false" placeholder="例：3 3_5_ 6_1'_ 1'_6_ | 5 5_6_ 5 - |">${esc(v('rhText',''))}</textarea>
    <div class="form" style="margin-top:8px"><label>右手整体移八度<select id="ed-rho">${[[1,'高一个八度'],[0,'不移动'],[-1,'低一个八度']].map(([n,t])=>`<option value="${n}" ${+v('rhOct',0)===n?'selected':''}>${t}</option>`).join('')}</select></label></div>
    <h2 class="section-t">左手</h2>
    <div class="form"><label>左手怎么弹<select id="ed-lhm">${[['none','不要左手（只练右手）'],['root','自动配：每小节一个低音'],['fifth','自动配：低音 + 五度'],['manual','我自己写左手简谱']].map(([k,t])=>`<option value="${k}" ${v('lhMode','root')===k?'selected':''}>${t}</option>`).join('')}</select></label>
      <label id="ed-lho-l">左手整体移八度<select id="ed-lho">${[[0,'不移动'],[-1,'低一个八度'],[-2,'低两个八度']].map(([n,t])=>`<option value="${n}" ${+v('lhOct',-1)===n?'selected':''}>${t}</option>`).join('')}</select></label></div>
    <textarea class="jp-area" id="ed-lh" spellcheck="false" style="margin-top:8px" placeholder="例：[1 5] - - - | [4 1'] - [5 2'] - |">${esc(v('lhText',''))}</textarea>
    <details class="blk" ${c?'':'open'}><summary style="cursor:pointer;font-weight:600">简谱怎么输入</summary><div class="jp-help" style="margin-top:8px">
      <code>1</code>–<code>7</code> 是 do re mi fa sol la si，<code>0</code> 是休止；<code>|</code> 是小节线（写上能帮你检查拍数）<br>
      高八度在后面加 <code>'</code>（如 <code>1'</code>），低八度加 <code>,</code>（如 <code>5,</code>）；升降号写在前面：<code>#4</code>、<code>b7</code><br>
      不加记号 = 1 拍；后面加 <code>_</code> = 半拍，加 <code>__</code> = 1/4 拍；加 <code>.</code> = 附点；单独一个 <code>-</code> = 再延长 1 拍<br>
      左手和弦用方括号：<code>[1 3 5]</code>；全角符号和中文逗号也能识别<br>
      例：<code>3 3_5_ 6_1'_ 1'_6_ | 5 5_6_ 5 - |</code></div></details>
    <div id="ed-msg" class="blk"></div>
    <div class="staffbox"><div class="score" id="ed-prev" style="width:100%"><p class="muted">在上面输入简谱，这里会显示五线谱和自动配好的指法。</p></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
      <button class="btn" id="ed-play">${ICON.speaker}试听</button>
      <button class="btn pri" id="ed-save">保存并开始练习</button>
      ${c?`<button class="btn" id="ed-del">删除这首</button>`:''}
    </div>
    <p class="muted" style="font-size:12px;margin-top:12px">录入的曲子只保存在你自己的设备（或你的 Claude 账号）里，不会公开。</p>

  let cur=null;

function xpKeys(frac){

  return `<div class="xpkeys">${w}${blk}</div>`;
}
function nextSong(){
  if(curProfile().kid){ for(let i=0;i<KIDS.length;i++){ if(!kidUnlocked(i)) break; if((PG.stars[KIDS[i].id]||0)<2) return KIDS[i].id; } }

function heatmap(){
  const end=new Date(); const start=new Date(); start.setDate(end.getDate()-(7*16-1)-end.getDay());
  let h='<div class="heat" aria-label="练琴日历">'; const d=new Date(start);

    h+=`<i class="${lv?'l'+lv:''}" title="${dayKey(d)}：${Math.round(s/60)} 分钟"></i>`; d.setDate(d.getDate()+1);}
  return h+`</div><div class="muted" style="font-size:12px;margin-top:8px">颜色越深练得越久：浅 &lt; 5 分钟 · 中 &lt; 20 分钟 · 深 ≥ 20 分钟</div>`;
}

function savePrefs(){ PG.settings.songPrefs=PG.settings.songPrefs||{}; PG.settings.songPrefs[PL.id]={hands:PL.hands,tf:PL.tf}; PG.settingsAt=Date.now(); save(); }
function sections(P){
  const out=[{label:'全曲',a:0,b:P.measures.length-1}];
  const first=P.pickup?1:0; const n=P.measures.length;
  const size=P.measures.length-first>12?4:4;
  for(let s=first;s<n;s+=size){ const a=s===first?0:s, b=Math.min(n-1,s+size-1); const na=P.pickup?Math.max(1,a):a+1, nb=P.pickup?b:b+1;
    out.push({label:`第 ${na}–${nb} 小节`,a,b}); }
  return out.length>2?out:[out[0]];
}
const secStart=()=>PL.P.measures[PL.secA].t;
const secEnd=()=>{const m=PL.P.measures[PL.secB]; return Math.min(PL.P.end,m.t+m.len);};
const handOn=h=>PL.hands==='B'||PL.hands===h;
function setKbBase(){
  const P=PL.P; const ms=P.evs.filter(e=>!e.rest&&handOn(e.hand)).flatMap(e=>e.notes.map(n=>n.midi));
  const lo=Math.min(...ms); INPUT.base=Math.max(PL.kb.lo,Math.floor(lo/12)*12); updKbHint();

let PL_RT=null;

function plRender(){

  const short=$('#plscorewrap').clientHeight<220;
  const R=renderScore(host,PL.P,{width:w,s:short?6.5:w<520?7.5:9,tight:short,beatW:w<520?3.3:4.2,minW:w<520?2.4:2.6,labels:short?null:(PG.settings.label||null),fingers:!short&&PG.settings.fingers,aria:PL.song.title+' 乐谱'});
  PL.R=R; PL.gs=[]; $$('g.ev',host).forEach(g=>PL.gs[+g.dataset.i]=g);
  PL.ph=R.svg.querySelector('.ph');
  PL.P.evs.forEach(e=>{ const g=PL.gs[e.i]; if(g) g.classList.toggle('dim',!handOn(e.hand)); });

  if(PL.mode==='wait'&&PL.wm) wmShow(); else plShowAt(PL.startBeat,false);

// 在给定拍位显示高亮
function plShowAt(b,auto){
  const P=PL.P; const cur=[], nx=[];
  for(const e of P.evs){ if(e.rest) continue; if(e.t<=b+1e-6&&b<e.t+e.d-1e-6) cur.push(e); }
  let nt=Infinity; for(const e of P.evs){ if(!e.rest&&handOn(e.hand)&&e.t>b+1e-6&&e.t<nt) nt=e.t; }
  for(const e of P.evs){ if(!e.rest&&handOn(e.hand)&&Math.abs(e.t-nt)<1e-6) nx.push(e); }
  plHighlight(cur,nx,b,auto);
}
function plHighlight(cur,nx,b,auto){
  const sig=cur.map(e=>e.i).join(',')+'|'+nx.map(e=>e.i).join(',');
  if(sig===PL.lastSig) return; PL.lastSig=sig;
  $$('g.ev.cur,g.ev.nx',$('#plscore')).forEach(g=>g.classList.remove('cur','nx'));
  cur.forEach(e=>PL.gs[e.i]&&PL.gs[e.i].classList.add('cur'));
  nx.forEach(e=>PL.gs[e.i]&&PL.gs[e.i].classList.add('nx'));
  // 光标
  const lead=cur.find(e=>handOn(e.hand))||cur[0]||nx[0];
  if(lead&&PL.R.evPos[lead.i]&&PL.ph){ const p=PL.R.evPos[lead.i], box=PL.R.sysBox[p.sys];
    PL.ph.setAttribute('x',f1(p.x-PL.R.s*1.4)); PL.ph.setAttribute('y',f1(box.top)); PL.ph.setAttribute('height',f1(box.bottom-box.top));
    if(p.sys!==PL.curSys){ PL.curSys=p.sys; scrollSys(box,auto); } }
  // 键盘
  const states=new Map(); const lab=PG.settings.label||'name', dp=PL.P.doPc||0;
  nx.forEach(e=>e.notes.forEach(n=>states.set(n.midi,{c:'nx'})));
  cur.forEach(e=>e.notes.forEach(n=>{ const on=handOn(e.hand);
    if(on) states.set(n.midi,{c:e.hand,f:PG.settings.fingers?n.f:'',lab:keyLabel(n.midi,lab,dp)});
    else if(!states.has(n.midi)) states.set(n.midi,{c:'acc'}); }));
  // 手放这里：按当前指法推出其余四根手指自然落在哪几个白键上
  // （按曲子的调走音阶，所以 G 大调里 3 指会落在 F♯ 上）
  if(PG.settings.fingers){ const sc=[]; for(let m=21;m<=108;m++) if(MAJ.includes(((m-dp)%12+12)%12)) sc.push(m);
    cur.forEach(e=>{ if(!handOn(e.hand)||!e.notes[0].f) return; const n=e.notes[0];
      let i=sc.findIndex(x=>x>=n.midi); if(i<0) return; if(sc[i]!==n.midi&&i>0) i--;
      for(let k=1;k<=5;k++){ if(k===n.f) continue; const m=sc[i+(e.hand==='R'?1:-1)*(k-n.f)];
        if(m!=null&&!states.has(m)&&PL.kb.keys.has(m)&&!e.notes.some(x=>x.f===k)) states.set(m,{c:'pos'+e.hand,f:k}); } }); }
  kbSet(PL.kb,states);
  const ms=cur.filter(e=>handOn(e.hand)).flatMap(e=>e.notes.map(n=>n.midi)); if(ms.length) kbCenter(PL.kb,ms);
}
function scrollSys(box,smooth){
  const wrap=$('#plscorewrap'), svg=PL.R.svg; if(!wrap||!svg) return;
  const scale=svg.getBoundingClientRect().width/svg.viewBox.baseVal.width;
  const top=svg.getBoundingClientRect().top-wrap.getBoundingClientRect().top+wrap.scrollTop+box.top*scale;
  const bottom=top+(box.bottom-box.top)*scale;
  if(top<wrap.scrollTop+8||bottom>wrap.scrollTop+wrap.clientHeight-8) wrap.scrollTo({top:Math.max(0,top-12),behavior:smooth?'smooth':'auto'});
}
function plIdle(){
  PL.wm=null; PL.lastSig='';
  plShowAt(PL.startBeat,true);
  $('#plplay').innerHTML=ICON.play; $('#plplay').setAttribute('aria-label','播放');
  const hint=PL.hands==='B'?'双手一起弹':PL.hands==='L'?'你弹左手，'+(PL.song.lh?'右手由电脑伴奏':''):'你弹右手'+(PL.song.lh?'，左手由电脑伴奏':'');
  $('#plstatus').innerHTML=MIC.on?`<span class="msg"><b>跟随模式 · 正在听</b> · 按播放后跟着光标在钢琴上弹，弹对的音会变绿、没听到的变红。${hint}。</span>`
    :`<span class="msg"><b>跟随模式</b> · 光标按节拍前进，跟着弹。${hint}。点谱子上的音符可以从那里开始。</span>`;

function plJump(ev){
  const t=ev.t; if(t<secStart()-1e-6||t>=secEnd()-1e-6){ PL.secA=0; PL.secB=PL.P.measures.length-1; $('#plsec').value='0'; }
  if(PL.mode==='wait'){ wmStart(t); return; }
  const was=PL.playing; plStop(); PL.startBeat=t; plIdle(); if(was) plPlay();
}
/* 跟随模式：调度 + 动画 */
function plPlay(){
  const ctx=audio(); const spb=60/(PL.song.bpm*PL.tf);
  const b0=PL.startBeat>=secEnd()-1e-6?secStart():PL.startBeat;
  PL.b0=b0; PL.T0=ctx.currentTime+.12+PL.countIn*PL.clickUnit*spb; PL.ciEnd=PL.T0;
  for(let k=0;k<PL.countIn;k++) click(PL.T0-(PL.countIn-k)*PL.clickUnit*spb,k===0);
  PL.nextEv=PL.P.evs.findIndex(e=>e.t>=b0-1e-6); if(PL.nextEv<0) PL.nextEv=PL.P.evs.length;
  PL.nextClick=b0; PL.playing=true; PL.lastSig=''; PL.lastSpb=spb;
  PL.fb=MIC.on?{pend:[],hit:0,total:0}:null; if(MIC.on) clearMarks();
  $('#plplay').innerHTML=ICON.pause; $('#plplay').setAttribute('aria-label','暂停');
  PL.timer=setInterval(plSched,25); plSched(); PL.raf=requestAnimationFrame(plFrame);
}
function plSched(){
  const ctx=AU.ctx, now=ctx.currentTime, hz=now+.15, spb=60/(PL.song.bpm*PL.tf), E=secEnd(), evs=PL.P.evs;
  while(PL.nextEv<evs.length){ const e=evs[PL.nextEv]; if(e.t>=E-1e-6){PL.nextEv=evs.length;break;}
    const T=PL.T0+(e.t-PL.b0)*spb; if(T>hz) break;
    if(!e.rest&&((PL.demo&&!MIC.on)||!handOn(e.hand))) e.notes.forEach(n=>tone(n.midi,T,e.d*spb*.96,e.hand==='L'?.55:.72));
    if(!e.rest&&handOn(e.hand)&&MIC.on&&PL.fb) { const sound=new Set(); evs.forEach(x=>{ if(!x.rest&&x.t<=e.t+1e-6&&e.t<x.t+x.d-1e-6) x.notes.forEach(n=>sound.add(n.midi)); });
      PL.fb.pend.push({e,T:T+outLat(),got:new Set(),on:false,req:new Set(e.notes.map(n=>n.midi)),sound}); }
    PL.nextEv++; }
  while(true){ const T=PL.T0+(PL.nextClick-PL.b0)*spb; if(T>hz||PL.nextClick>=E-1e-6) break;
    if(PL.metro){ const k=(PL.nextClick-(PL.P.pickup||0))/PL.P.bar; click(T,Math.abs(k-Math.round(k))<1e-6); }
    PL.nextClick+=PL.clickUnit; }
  const Tend=PL.T0+(E-PL.b0)*spb;
  if(PL.nextEv>=evs.length&&PL.nextClick>=E-1e-6&&hz>=Tend){
    if(PL.loop){ PL.b0=secStart(); PL.T0=Tend; PL.nextEv=evs.findIndex(e=>e.t>=PL.b0-1e-6); PL.nextClick=PL.b0; PL.loops=(PL.loops||0)+1; }
